<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>水浒传 · 版本阅读器</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="css/style.css">
<style>
:root{--content-width:960px;}
body{background:var(--paper);}

.read-wrap{max-width:var(--content-width);margin:0 auto;padding:18px 20px 80px;}

/* ===== 顶部栏 ===== */
.read-top{
  position:sticky;top:0;z-index:30;
  background:var(--paper);
  border-bottom:1px solid var(--border);
  padding:10px 0 12px;
  margin:0 -20px 24px;
  box-shadow:0 2px 8px rgba(0,0,0,.04);
}
.read-top-inner{
  max-width:var(--content-width);margin:0 auto;padding:0 20px;
  display:flex;flex-wrap:wrap;gap:14px 24px;align-items:center;
}
.brand{
  font-family:var(--font-serif);font-size:20px;color:var(--vermilion-deep);font-weight:700;
  letter-spacing:4px;cursor:pointer;margin-right:14px;flex-shrink:0;
}
.brand:hover{color:var(--vermilion);}

.ctrl-row{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;flex:1;}
.ctrl{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--ink-muted);font-family:var(--font-serif);}
.ctrl-label{white-space:nowrap;letter-spacing:2px;font-size:15px;color:#5a4631;}

/* 回目下拉 */
.chap-select{
  min-width:280px;max-width:520px;
  padding:6px 12px;
  border:1px solid var(--border);border-radius:4px;background:#fff;
  font-size:14px;color:var(--ink);font-family:var(--font-serif);
  cursor:pointer;
}

/* 版本按钮组 */
.ver-group{display:inline-flex;flex-wrap:wrap;gap:4px;}
.ver-btn{
  padding:6px 14px;
  border:1px solid var(--border);background:#fff;border-radius:4px;
  cursor:pointer;font-size:14px;color:var(--ink);font-family:var(--font-serif);
  transition:all .18s;letter-spacing:1px;white-space:nowrap;
}
.ver-btn:hover{border-color:var(--vermilion);color:var(--vermilion);}
.ver-btn.active{background:var(--vermilion-deep);color:#fff;border-color:var(--vermilion-deep);}

/* 语体按钮 */
.lang-group{display:inline-flex;gap:2px;}
.lang-btn{
  padding:6px 12px;border:1px solid var(--border);background:#fff;cursor:pointer;
  font-size:14px;font-family:var(--font-serif);color:var(--ink);
}
.lang-btn:first-child{border-radius:4px 0 0 4px;}
.lang-btn:last-child{border-radius:0 4px 4px 0;border-left:none;}
.lang-btn:not(:first-child):not(:last-child){border-left:none;}
.lang-btn.active{background:var(--vermilion-deep);color:#fff;border-color:var(--vermilion-deep);}
.lang-btn.active + .lang-btn{border-left-color:var(--vermilion-deep);}

/* 复选框 */
.chk{display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-size:14px;color:var(--ink);font-family:var(--font-serif);user-select:none;}
.chk input{
  width:16px;height:16px;cursor:pointer;accent-color:var(--vermilion-deep);
}
.chk .blue-tick{color:var(--jade);}

/* ===== 正文 ===== */
.chap-title{
  font-family:var(--font-serif);text-align:center;font-size:28px;color:var(--vermilion-deep);
  font-weight:700;letter-spacing:6px;margin:10px 0 6px;
}
.chap-ver{text-align:center;font-size:13px;color:var(--ink-muted);margin-bottom:28px;letter-spacing:2px;}

.content-wrap{font-family:var(--font-serif);font-size:18px;line-height:2;color:var(--ink);}
.content-wrap p{text-indent:2em;margin:0 0 6px;}
.content-wrap .poem{text-align:center;color:var(--ink-light);margin:18px auto;font-style:italic;}
.content-wrap .poem p{text-indent:0;margin:2px 0;}
.content-wrap h3{
  font-family:var(--font-serif);text-align:center;color:var(--vermilion-deep);
  font-size:20px;margin:28px 0 14px;letter-spacing:4px;font-weight:700;
}

/* ===== 批语块（红楼梦风格：左侧色竖线+小标签） ===== */
.cmt-block{
  margin:12px 0;
  padding:10px 16px;
  background:#fdf6e8;
  border-left:3px solid var(--gold);
  border-radius:0 6px 6px 0;
  font-size:15px;line-height:1.9;
  color:var(--ink-light);
  font-family:var(--font-serif);
}
.cmt-block .who{
  display:inline-block;
  padding:1px 8px;margin-right:8px;
  font-size:12px;letter-spacing:1px;
  background:var(--gold);color:#fff;
  border-radius:3px;
  font-family:var(--font-serif);font-weight:600;
  vertical-align:middle;
}
.cmt-block .cmt-type{
  font-size:12px;color:var(--ink-muted);margin-right:6px;font-family:var(--font-serif);
}
.cmt-block.c-jinpi{border-left-color:#8b1a1a;background:#fdf3ee;}
.cmt-block.c-jinpi .who{background:#8b1a1a;}
.cmt-block.c-lizhuo{border-left-color:#8b4513;background:#f8efe3;}
.cmt-block.c-lizhuo .who{background:#8b4513;}
.cmt-block.c-yuanwy{border-left-color:#2e5a88;background:#eef3f7;}
.cmt-block.c-yuanwy .who{background:#2e5a88;}
.cmt-block.c-jiqin{border-left-color:#2f5d50;background:#edf3ef;}
.cmt-block.c-jiqin .who{background:#2f5d50;}
.cmt-block.c-preface{background:#f5ead0;}

/* 白话文（附在原文段落后） */
.bai-block{
  margin:6px 0 16px;
  padding:10px 16px;
  background:#f3efe3;
  border-left:3px solid var(--ink-muted);
  border-radius:0 6px 6px 0;
  font-size:15px;line-height:1.9;
  color:#555;
  font-family:var(--font-serif);
}
.bai-block::before{
  content:'白话译文';
  display:inline-block;
  padding:1px 8px;margin-right:8px;
  font-size:12px;letter-spacing:1px;
  background:var(--ink-muted);color:#fff;
  border-radius:3px;
  font-family:var(--font-serif);font-weight:600;
  vertical-align:middle;
}

/* 只看批语模式：隐藏正文段落 */
body.cmt-only .txt-p{display:none;}
body.cmt-only .poem{display:none;}
body.cmt-only .bai-block{display:none;}
body.cmt-only h3{display:none;}
body.cmt-only .cmt-block{display:block;}

/* 分页 */
.pager{display:flex;justify-content:space-between;margin-top:48px;padding-top:24px;border-top:1px solid var(--border);}
.pager a{padding:10px 22px;border:1px solid var(--border);border-radius:4px;color:var(--ink);text-decoration:none;font-family:var(--font-serif);font-size:14px;transition:all .2s;}
.pager a:hover{background:var(--vermilion-deep);color:#fff;border-color:var(--vermilion-deep);}
.pager .disabled{opacity:.3;pointer-events:none;}

/* 注释/提示 */
.notice{text-align:center;color:var(--ink-muted);font-size:13px;margin-top:30px;padding:12px;background:#f7f1e1;border-radius:4px;}

.loading{text-align:center;padding:60px 0;color:var(--ink-muted);font-family:var(--font-serif);font-size:16px;letter-spacing:4px;}

@media(max-width:720px){
  .chap-select{min-width:180px;max-width:100%;}
  .brand{margin-right:0;width:100%;text-align:center;}
  .ctrl-row{gap:10px;}
}
</style>
</head>
<body>
<div class="read-wrap">
  <div class="read-top">
    <div class="read-top-inner">
      <span class="brand" onclick="location.href='index.html'">水浒传</span>
      <div class="ctrl-row">
        <span class="ctrl">
          <span class="ctrl-label">回目：</span>
          <select class="chap-select" id="selChap"></select>
        </span>
        <span class="ctrl">
          <span class="ctrl-label">版本：</span>
          <span class="ver-group" id="verGroup"></span>
        </span>
        <span class="ctrl">
          <span class="ctrl-label">语体：</span>
          <span class="lang-group">
            <button class="lang-btn active" data-lang="fan">繁</button>
            <button class="lang-btn" data-lang="jian">简</button>
            <button class="lang-btn" data-lang="bai">白</button>
          </span>
        </span>
        <span class="ctrl">
          <label class="chk"><input type="checkbox" id="chkCmtOnly"> 只看批语</label>
        </span>
        <span class="ctrl">
          <label class="chk"><input type="checkbox" id="chkBai" checked> <span class="blue-tick">✓</span> 附白话文</label>
        </span>
      </div>
    </div>
  </div>

  <h1 class="chap-title" id="chapTitle">加载中…</h1>
  <div class="chap-ver" id="chapVer"></div>

  <div class="content-wrap" id="contentWrap">
    <div class="loading">正在载入正文…</div>
  </div>

  <div class="pager" id="pager"></div>
</div>

<script>
/* ========== 状态 ========== */
const state = {
  vid: new URLSearchParams(location.search).get('vid') || 'jin70_pi',
  ch: parseInt(new URLSearchParams(location.search).get('ch') || '1', 10),
  lang: localStorage.getItem('sh_lang') || 'fan',
  cmt: localStorage.getItem('sh_cmt') || 'jinpi',
  cmtOnly: localStorage.getItem('sh_cmtOnly') === '1',
  withBai: localStorage.getItem('sh_withBai') !== '0',
  versions: [],
  chapters: {},
  comments: { jinpi:null, jiqin:null, lizhuo:null, yuanwy:null },
  cmtData: null
};

async function loadJSON(p){ const r=await fetch(p); if(!r.ok) throw new Error('load '+p+' fail'); return r.json(); }
async function loadText(p){ const r=await fetch(p); if(!r.ok) return null; return r.text(); }

const CMT_META = {
  jinpi: { key:'jinpi', label:'金圣叹', cls:'c-jinpi', file:'jinpi_comments.json',
           okVer:['v70','jin70','jin70_pi','jinshengtan'] },
  lizhuo:{ key:'lizhuo', label:'李卓吾·容与堂', cls:'c-lizhuo', file:'lizhuo_comments.json',
           okVer:['v100','jiqin'] },
  yuanwy:{ key:'yuanwy', label:'袁无涯·杨定见', cls:'c-yuanwy', file:'yuanwy_comments.json',
           okVer:['v120'] },
  jiqin: { key:'jiqin', label:'冀勤 校注', cls:'c-jiqin', file:'jiqin_notes.json',
           okVer:['v100','jiqin'] }
};

// 自动决定默认批注
function defaultCmtFor(vid){
  if(['v70','jin70','jin70_pi','jinshengtan'].includes(vid)) return 'jinpi';
  if(vid==='v120') return 'yuanwy';
  if(['v100','jiqin'].includes(vid)) return 'lizhuo';
  return 'none';
}

/* ========== 初始化 ========== */
async function boot(){
  const idx = await loadJSON('texts/versions/versions_index.json');
  state.versions = idx.versions;
  renderVerButtons();

  // 语体
  document.querySelectorAll('.lang-btn').forEach(b=>{
    if(b.dataset.lang===state.lang) b.classList.add('active'); else b.classList.remove('active');
    b.onclick = ()=>{
      document.querySelectorAll('.lang-btn').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      state.lang=b.dataset.lang; localStorage.setItem('sh_lang', state.lang);
      loadChapter();
    };
  });

  // 复选框
  const cmtOnlyCk=document.getElementById('chkCmtOnly'), baiCk=document.getElementById('chkBai');
  cmtOnlyCk.checked=state.cmtOnly; baiCk.checked=state.withBai;
  document.body.classList.toggle('cmt-only', state.cmtOnly);
  cmtOnlyCk.onchange=()=>{
    state.cmtOnly=cmtOnlyCk.checked; localStorage.setItem('sh_cmtOnly', state.cmtOnly?'1':'0');
    document.body.classList.toggle('cmt-only', state.cmtOnly);
  };
  baiCk.onchange=()=>{
    state.withBai=baiCk.checked; localStorage.setItem('sh_withBai', state.withBai?'1':'0');
    loadChapter();
  };

  // 选到默认批注
  if(!CMT_META[state.cmt] || !CMT_META[state.cmt].okVer.includes(state.vid)){
    state.cmt = defaultCmtFor(state.vid);
    localStorage.setItem('sh_cmt', state.cmt);
  }

  await loadVersion(true);
}

const VER_SHORT = {
  v120:'袁无涯·120', v100:'容与堂·100', v70:'金本·70', jin70:'金批繁·70',
  jiqin:'冀勤校注', jin70_pi:'金批全本', jinshengtan:'金批简·70', zsk:'征四寇'
};

function renderVerButtons(){
  const g = document.getElementById('verGroup');
  g.innerHTML = state.versions.map(v=>
    `<button class="ver-btn ${v.id===state.vid?'active':''}" data-vid="${v.id}" title="${v.name}·${v.count||'?'}回">${VER_SHORT[v.id]||v.name.slice(0,6)}</button>`
  ).join('');
  g.querySelectorAll('.ver-btn').forEach(b=>{
    b.onclick=()=>{
      state.vid=b.dataset.vid;
      // 切版本时自动切批注到最适配
      const defCmt = defaultCmtFor(state.vid);
      if(defCmt!=='none'){ state.cmt=defCmt; localStorage.setItem('sh_cmt', state.cmt); }
      state.ch=1;
      renderVerButtons();
      syncURL(); loadVersion();
    };
  });
}

async function loadVersion(first){
  if(!state.chapters[state.vid]){
    try{ state.chapters[state.vid] = await loadJSON(`texts/versions/${state.vid}/chapters.json`); }
    catch(e){
      document.getElementById('contentWrap').innerHTML = '<div class="loading">该版本尚未整理完成</div>';
      return;
    }
  }
  const cnt = state.chapters[state.vid].count;
  if(state.ch>=cnt) state.ch = cnt-1;
  if(state.ch<0) state.ch=0;

  // 回目下拉（红楼梦样式：1. 回目名）
  const sel = document.getElementById('selChap');
  sel.innerHTML = state.chapters[state.vid].chapters.map((c,i)=>{
    const num = i===0 && /楔子|引首/.test(c.title||'')?'楔子':(i+'. '+(c.title||'第'+i+'回'));
    return `<option value="${i}">${num}</option>`;
  }).join('');
  sel.value = state.ch;
  sel.onchange = ()=>{ state.ch=parseInt(sel.value,10); syncURL(); loadChapter(); window.scrollTo(0,0); };

  if(!first) syncURL();
  await loadChapter();
}

function syncURL(){
  const u=new URL(location.href);
  u.searchParams.set('vid',state.vid); u.searchParams.set('ch',state.ch);
  history.replaceState({},'',u.toString());
}

/* ========== 读取正文 ========== */
async function loadChapter(){
  const chap = state.chapters[state.vid].chapters[state.ch];
  document.getElementById('chapTitle').textContent = chap.title || `第${state.ch+1}回`;
  document.getElementById('chapVer').textContent = state.chapters[state.vid].version_name;
  const wrap = document.getElementById('contentWrap');
  wrap.innerHTML = '<div class="loading">正在载入正文…</div>';
  const fname = chap.file;
  if(!fname){ wrap.innerHTML='<div class="loading">无此回正文</div>'; updatePager(); return; }

  // 读原文
  const fp = `texts/versions/${state.vid}/${state.lang}/${fname}`;
  let txt = await loadText(fp);
  // 如果选了繁/简但文本不存在，fallback到fan
  if(!txt && state.lang!=='fan'){ txt = await loadText(`texts/versions/${state.vid}/fan/${fname}`); }
  if(!txt){
    wrap.innerHTML = `<div class="loading">该版本此语体暂未整理<br><small>${fp}</small></div>`;
    updatePager(); return;
  }

  // 读白话文（附在原文后；语体=白时不需要再附）
  let baiTxt = null;
  if(state.withBai && state.lang!=='bai'){
    baiTxt = await loadText(`texts/versions/${state.vid}/bai/${fname}`);
  }

  // 解析金批本 「」 夹批
  state.cmtData = parseJinpiAnchors(txt, state.cmt);
  // 若为金本，去掉原文里「」夹批（批注内容已独立抽出为cmt块）
  if(state.vid==='jin70_pi' && state.cmt==='jinpi'){
    txt = txt.replace(/「([^」]+)」/g,'');
  }

  let html = '';

  // 回前总批（金本preface / 李卓吾 / 袁无涯 / 冀勤）
  html += await renderPrefaceComments();

  // 正文+夹批交错
  html += renderTextWithComments(txt);

  // 白话文
  if(baiTxt){
    html += '<div style="margin-top:28px;padding-top:14px;border-top:1px dashed var(--border);"><div style="text-align:center;color:var(--vermilion-deep);font-family:var(--font-serif);font-size:14px;letter-spacing:4px;margin-bottom:8px;">── 白话译文 ──</div>';
    html += renderPlainBlocks(baiTxt, 'bai');
    html += '</div>';
  }

  // 回末总评
  html += await renderPostfaceComments();

  // 不适用提示
  const meta = CMT_META[state.cmt];
  if(meta && !meta.okVer.includes(state.vid)){
    html += `<div class="notice">此批注（${meta.label}）仅适用于 ${meta.okVer.map(v=>verName(v)).join('、')}，请切换到相应版本查看。</div>`;
  }

  wrap.innerHTML = html;
  updatePager();
}

function verName(id){
  const v = state.versions.find(x=>x.id===id); return v?v.short||v.name.split('（')[0]:id;
}

/* 解析「」夹批（金本自带）*/
function parseJinpiAnchors(txt, cmtKey){
  if(cmtKey!=='jinpi' || state.vid!=='jin70_pi') return null;
  const blocks = [];
  const re = /「([^」]{4,300})」/g;
  let m; let last=0; let idx=0;
  while((m=re.exec(txt))!==null){
    if(m.index>last) blocks.push({type:'txt', content:txt.slice(last,m.index)});
    blocks.push({type:'cmt', content:m[1].trim(), idx:++idx});
    last = m.index+m[0].length;
  }
  if(last<txt.length) blocks.push({type:'txt', content:txt.slice(last)});
  return blocks;
}

/* 金本：正文+夹批交错渲染 */
function renderTextWithComments(txt){
  if(state.cmtData && state.cmt==='jinpi'){
    let html='';
    // 先剔除【回前總批】【正文】等结构性标记
    const cleanBlocks = state.cmtData.map(b=>{
      if(b.type==='txt'){
        let c = b.content.replace(/【回前[總总]批】[\s\S]*?【正文】/,'').replace(/【正文】/g,'').trim();
        return {type:'txt', content:c};
      }
      return b;
    }).filter(b=>b.content && b.content.trim());
    let buf='';
    const flush = ()=>{
      if(buf.trim()) html += renderPlainBlocks(buf.trim(), 'txt');
      buf='';
    };
    cleanBlocks.forEach(b=>{
      if(b.type==='txt'){ buf += '\n'+b.content; }
      else{
        flush();
        html += cmtBlockHTML('jinpi','夹批',b.content);
      }
    });
    flush();
    return html;
  }
  return renderPlainBlocks(txt, 'txt');
}

/* 将纯文本渲染为段落/诗块 */
function renderPlainBlocks(txt, kind){
  // 先移除【回前總批】…【正文】结构（金本残留）
  txt = txt.replace(/【回前[總总]批】[\s\S]*?【正文】/g,'').replace(/【正文】/g,'');
  // 移除卷首重复的标题/回前总批标记
  const blocks = txt.split(/\n\s*\n/);
  let html = '';
  blocks.forEach(b=>{
    b = b.trim();
    if(!b) return;
    const lines = b.split(/\n/).map(l=>l.trim().replace(/^　+/,'').replace(/^ +/,'')).filter(Boolean);
    if(!lines.length) return;
    const isPoem = (lines.length>=2 && lines.every(l=>l.length<40) &&
      (/诗[曰：:]|词[曰：:]|古风|偈|吟|赋|^歌[曰：:]|^但见|^有诗为证|^怎见得|^诗曰|^词曰|^古风/.test(lines[0]) ||
       (lines.length>=2 && lines.every(l=>/[，。？！,?.!]$/.test(l) || /[韵平仄]/.test(l))) )
    );
    if(isPoem){
      if(kind==='bai'){
        html += '<div class="bai-block"><div class="poem">';
        lines.forEach(l=>html+='<p>'+esc(l)+'</p>');
        html += '</div></div>';
      }else{
        html += '<div class="poem" class="txt-p">';
        lines.forEach(l=>html+='<p>'+esc(l)+'</p>');
        html += '</div>';
      }
    }else if(/^第[一二三四五六七八九十百零]+回|^楔子|^引首/.test(lines[0]) && lines[0].length<50){
      html += '<h3 class="txt-p">'+esc(lines.join(' '))+'</h3>';
    }else{
      lines.forEach(l=>{
        if(kind==='bai'){
          html += '<div class="bai-block">'+esc(l)+'</div>';
        }else{
          html += '<p class="txt-p">'+esc(l)+'</p>';
        }
      });
    }
  });
  return html;
}

function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function cmtBlockHTML(key, type, text){
  const m = CMT_META[key]; if(!m) return '';
  if(!text || !text.trim()) return '';
  return `<div class="cmt-block ${m.cls}${type==='回前总批'||type==='preface'?' c-preface':''}">
    <span class="who">${m.label}</span><span class="cmt-type">${type}</span>${esc(text.trim()).replace(/\n/g,'<br>')}
  </div>`;
}

/* 回前总批 */
async function renderPrefaceComments(){
  if(state.cmt==='none') return '';
  const meta = CMT_META[state.cmt]; if(!meta) return '';
  if(!meta.okVer.includes(state.vid)) return '';
  if(!state.comments[meta.key]){
    try{ state.comments[meta.key]=await loadJSON('texts/versions/'+meta.file); }catch(e){ state.comments[meta.key]=null; }
  }
  const data = state.comments[meta.key]; if(!data) return '';
  let html='';

  if(meta.key==='jinpi'){
    const sub = data.jin70_pi||data;
    const ch = sub[String(state.ch)];
    if(ch && ch.preface){
      html += cmtBlockHTML('jinpi','回前总批', ch.preface);
    }
  }

  if(meta.key==='lizhuo' || meta.key==='yuanwy'){
    const chaps = data.chapters||[];
    if(state.ch<=1){
      // 序文
      chaps.forEach(c=>{(c.preface_comments||[]).forEach(p=>{
        html += cmtBlockHTML(meta.key, p.source||'序文', p.text);
      });});
      // 全书总评
      const all = chaps.find(c=>c.chapter==='全书');
      if(all) (all.chapter_comments||[]).forEach(c=>{
        html += cmtBlockHTML(meta.key, c.type||'总评', c.text);
      });
    }
    // 回前/回末匹配当前回
    const matched = matchCriticChapter(chaps);
    if(matched && matched.chapter_comments){
      matched.chapter_comments.filter(c=>c.type==='回前批'||c.type==='回前总评').forEach(c=>{
        html += cmtBlockHTML(meta.key, c.type||'眉批', c.text);
      });
    }
  }

  if(meta.key==='jiqin'){
    // 冀勤校注是注疏，不在回前显示
  }
  return html;
}

/* 回末总评/夹批 */
async function renderPostfaceComments(){
  if(state.cmt==='none') return '';
  const meta = CMT_META[state.cmt]; if(!meta) return '';
  if(!meta.okVer.includes(state.vid)) return '';
  const data = state.comments[meta.key]; if(!data) return '';
  let html='';

  if(meta.key==='jinpi' && state.vid!=='jin70_pi'){
    // 非金本（如v70、jin70、jinshengtan）——夹批列表在末尾列出
    const sub = data.jin70_pi||data;
    const ch = sub[String(state.ch)];
    if(ch){
      const keys = Object.keys(ch).filter(k=>k!=='preface' && k!=='inline_count');
      if(keys.length){
        keys.forEach((k,i)=>{
          const t=ch[k];
          if(typeof t==='string') html += cmtBlockHTML('jinpi','夹批·'+(i+1),t);
          else if(t && typeof t==='object'){
            Object.entries(t).forEach(([kk,vv])=>{
              html += cmtBlockHTML('jinpi','夹批·'+(i+1)+'.'+kk, String(vv));
            });
          }
        });
      }
    }
  }

  if(meta.key==='lizhuo' || meta.key==='yuanwy'){
    const chaps = data.chapters||[];
    const matched = matchCriticChapter(chaps);
    if(matched && matched.chapter_comments){
      matched.chapter_comments.filter(c=>c.type!=='回前批'&&c.type!=='回前总评').forEach(c=>{
        const label = c.anchor? `${c.type||'眉批'}·${c.anchor}` : (c.type||'眉批');
        html += cmtBlockHTML(meta.key, label, c.text);
      });
    }
    if(state.ch<=1 && data.art_theory && data.art_theory.length){
      data.art_theory.forEach(a=>{
        html += cmtBlockHTML(meta.key, '艺术论·'+a.keyword, `【${a.source}】${a.point}`);
      });
    }
  }

  if(meta.key==='jiqin'){
    // 冀勤校注本：列出本回注释
    let chData = null;
    if(data.jiqin) chData = data.jiqin[String(state.ch)];
    else chData = data[String(state.ch)];
    if(chData){
      const keys = Object.keys(chData).filter(k=>k!=='preface');
      if(keys.length){
        html += `<div style="margin-top:30px;padding-top:14px;border-top:1px dashed var(--border);"><div style="text-align:center;color:var(--jade);font-family:var(--font-serif);font-size:14px;letter-spacing:4px;margin-bottom:8px;">── 冀勤校注 · 共${keys.length}条 ──</div>`;
        keys.forEach((k,i)=>{
          const t=chData[k];
          if(typeof t==='string') html += cmtBlockHTML('jiqin', '注'+(i+1), t);
        });
        html += '</div>';
      }
    }
  }

  return html;
}

function toCn(n){
  const cn=['零','一','二','三','四','五','六','七','八','九','十'];
  if(n<=10) return cn[n];
  if(n<20) return '十'+(n%10?cn[n%10]:'');
  if(n%10===0) return cn[Math.floor(n/10)]+'十';
  return cn[Math.floor(n/10)]+'十'+cn[n%10];
}
function matchCriticChapter(chaps){
  const chapObj = state.chapters[state.vid].chapters[state.ch];
  const curTitle = (chapObj&&chapObj.title)||'';
  let target;
  if(state.ch===0) target = curTitle.includes('引首')||curTitle.includes('楔子')||curTitle.includes('张天师')?'引首+第一回':null;
  else target = '第'+toCn(state.ch)+'回';
  return chaps.find(c=>{
    if(!c.chapter) return false;
    if(target && c.chapter===target) return true;
    if(curTitle && c.title && curTitle.replace(/\s/g,'').includes(c.title.replace(/\s/g,'').slice(0,8))) return true;
    return false;
  });
}

function updatePager(){
  const cnt = state.chapters[state.vid].count;
  const prev=state.ch-1, next=state.ch+1;
  let html='';
  html += prev>=0?`<a href="#" onclick="goto(${prev});return false;">← 上一回</a>`:`<a class="disabled">← 上一回</a>`;
  html += next<cnt?`<a href="#" onclick="goto(${next});return false;">下一回 →</a>`:`<a class="disabled">下一回 →</a>`;
  document.getElementById('pager').innerHTML=html;
}
function goto(n){ state.ch=n; syncURL(); document.getElementById('selChap').value=n; loadChapter(); window.scrollTo(0,0); }

boot().catch(e=>{
  document.getElementById('contentWrap').innerHTML = '<div class="loading">加载失败：'+e.message+'</div>';
  console.error(e);
});
</script>
