<style>
/* ========== 阅读器专属 ========== */
.read-wrap{max-width:860px;margin:0 auto;padding:30px 24px 80px;font-family:var(--font-serif,"KaiTi","STKaiti",serif);}

/* ======== 顶部：全站导航 + 阅读器工具栏（整体吸顶，仿红楼梦参考图） ======== */
.read-header-all{position:sticky;top:0;z-index:100;background:rgba(253,248,238,0.97);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--border,#e6dcc4);}
.read-header-all .topbar{
  position:static;background:transparent;backdrop-filter:none;-webkit-backdrop-filter:none;
  max-width:860px;margin:0 auto;padding:0 16px;
  display:flex;align-items:center;gap:14px;height:44px;
  border-bottom:none;overflow:hidden;
}
.read-header-all .topbar .logo{font-size:16px;flex-shrink:0;display:flex;align-items:center;gap:6px;}
.read-header-all .topbar .logo .seal{width:26px;height:26px;font-size:13px;}
.read-header-all .topbar .logo span:last-child{display:none;} /* 单行模式下「水浒传本体论」隐藏，靠印章识别 */
.read-header-all .topbar .nav-links{
  display:flex;gap:2px;flex:1;flex-wrap:nowrap;overflow-x:auto;
  scrollbar-width:none;-ms-overflow-style:none;padding:0;
}
.read-header-all .topbar .nav-links::-webkit-scrollbar{display:none;}
.read-header-all .topbar .nav-links a{
  padding:4px 8px;font-size:13px;letter-spacing:0.5px;white-space:nowrap;
}
.read-header-all .topbar .nav-links .nav-dd{display:none;} /* 单行模式下隐藏数字研究下拉，避免撑高 */
.read-header-all .topbar .nav-links a.active{background:var(--vermilion-deep);color:var(--paper);}

.read-top{position:static;background:transparent;border-bottom:1px solid var(--border,#e6dcc4);}
.read-top-inner{
  max-width:860px;margin:0 auto;padding:8px 16px;
  display:flex;flex-wrap:nowrap;align-items:center;gap:10px;
  font-size:13px;color:var(--ink,#3a2a1a);overflow-x:auto;
  scrollbar-width:none;-ms-overflow-style:none;
}
.read-top-inner::-webkit-scrollbar{display:none;}

.tool-group{display:flex;align-items:center;gap:4px;flex-shrink:0;}
.tool-label{color:var(--ink-muted,#8a7a62);letter-spacing:1px;font-size:12px;margin-right:2px;}

/* 回目下拉 */
.chap-select{appearance:none;background:#fdf3df;border:1px solid var(--border,#e6dcc4);border-radius:4px;padding:4px 26px 4px 10px;font-family:var(--font-serif);font-size:13px;color:var(--ink,#3a2a1a);cursor:pointer;min-width:120px;max-width:320px;
background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='7' viewBox='0 0 10 7'><path d='M1 1l4 4 4-4' stroke='%238a7a62' stroke-width='1.5' fill='none' stroke-linecap='round'/></svg>");
background-repeat:no-repeat;background-position:right 8px center;}
.chap-select:focus{outline:none;border-color:var(--vermilion,#9c2a2a);}

/* 通用按钮组 */
.btn-group{display:inline-flex;gap:2px;flex-wrap:nowrap;}
.ui-btn{padding:4px 9px;background:transparent;border:1px solid var(--border,#e6dcc4);border-radius:4px;font-family:var(--font-serif);font-size:13px;color:var(--ink,#3a2a1a);cursor:pointer;transition:all .2s;letter-spacing:0.5px;line-height:1.4;}
.ui-btn:hover{background:#fdf3df;border-color:#d9cba5;}

/* 版本按钮 */
.ver-btn.active{background:var(--vermilion,#9c2a2a);color:#fdf3df;border-color:var(--vermilion,#9c2a2a);box-shadow:0 1px 4px rgba(156,42,42,0.15);}

/* 语体按钮 */
.lang-btn.active{background:#5a4632;color:#fdf3df;border-color:#5a4632;}

/* 勾选开关（小一号图标式） */
.chk{display:inline-flex;align-items:center;gap:3px;cursor:pointer;font-size:12px;color:var(--ink-muted,#8a7a62);user-select:none;padding:3px 6px;border:1px solid transparent;border-radius:4px;}
.chk:hover{color:var(--ink,#3a2a1a);background:#fdf3df;border-color:var(--border,#e6dcc4);}
.chk input[type=checkbox]{appearance:none;-webkit-appearance:none;width:14px;height:14px;border:1.5px solid var(--border,#c9bfa3);border-radius:2px;background:#fdf8ee;cursor:pointer;position:relative;transition:all .15s;vertical-align:middle;margin:0;}
.chk input[type=checkbox]:checked{background:var(--vermilion,#9c2a2a);border-color:var(--vermilion,#9c2a2a);}
.chk input[type=checkbox]:checked::after{content:"";position:absolute;left:3px;top:0;width:4px;height:7px;border:solid #fff;border-width:0 1.5px 1.5px 0;transform:rotate(45deg);}
.chk.on{color:var(--vermilion,#9c2a2a);background:#fdf0ee;border-color:#e8c0bd;}

/* ======== 正文区 ======== */
.chap-title{font-size:28px;font-weight:700;text-align:center;color:var(--vermilion-deep,#261810);margin:10px 0 6px;letter-spacing:6px;font-family:var(--font-serif);}
.chap-ver{text-align:center;color:var(--ink-muted,#8a7a62);font-size:13px;letter-spacing:3px;margin-bottom:28px;padding-bottom:18px;border-bottom:1px solid var(--border,#e6dcc4);}

.content-wrap{font-size:18px;line-height:2;color:var(--ink,#3a2a1a);}
.content-wrap p{margin:0;text-indent:2em;margin-bottom:4px;}
.content-wrap h3{font-size:22px;text-align:center;margin:30px 0 18px;letter-spacing:4px;color:var(--vermilion-deep,#261810);font-weight:700;}
.content-wrap .poem{margin:20px auto;padding:18px 28px;background:#f9f0d9;border-left:3px solid #c5a868;border-radius:0 4px 4px 0;text-align:center;font-size:16px;line-height:2;color:var(--ink-light,#5a4632);max-width:480px;}
.content-wrap .poem p{text-indent:0;margin:2px 0;}

/* 白话文附段（仿红楼 baihua 卡片：标题小绿胶囊 + 浅绿底） */
.baihua-block{margin:20px 0 28px;padding:12px 18px;background:rgba(245,242,232,0.9);border:1px solid rgb(227,217,196);border-radius:3px;font-size:16px;line-height:2;color:#4a4538;}
.baihua-block .baihua-label{display:inline-block;background:#9f946f;color:#fff;font-size:12px;padding:1px 10px;border-radius:10px;margin-right:10px;letter-spacing:2px;font-family:var(--font-serif);vertical-align:1px;font-weight:500;}

/* ======== 批注块（仿《红楼未完》段间嵌入版：左竖线 + 渐隐底 + 米色胶囊标签） ======== */
.cmt-block{margin:3px 0;padding:2px 0 2px 9px;border-radius:0 2px 2px 0;font-size:14.5px;line-height:28.275px;color:var(--anno-ink,#5a4c3e);font-family:var(--font-serif);background:linear-gradient(90deg,rgba(120,90,50,0.06),rgba(120,90,50,0) 70%);border-left:2px solid rgba(120,90,50,0.4);}
.cmt-block .cmt-tag{display:inline-block;padding:0 6px;border-radius:8px;font-size:11.5px;font-weight:500;margin-right:7px;letter-spacing:0.5px;vertical-align:1px;color:#6b6155;background:rgba(240,230,209,0.9);font-family:var(--font-serif);line-height:22px;}
.cmt-block .cmt-text{white-space:normal;}
.cmt-block .cmt-text p{text-indent:0;margin:0;}

/* 朱批系（金圣叹——原批多为朱色，配 #9e2b25） */
.cmt-jinpi{color:rgb(158,43,37);background:linear-gradient(90deg,rgba(158,43,37,0.055),rgba(158,43,37,0) 70%);border-left-color:rgba(158,43,37,0.4);}
.cmt-jinpi .cmt-tag{color:#6b6155;background:rgba(240,230,209,0.9);}

/* 墨批系（其余八家统一青绿基调 #3f6b5e，不单独调色；标签均为米色） */
.cmt-lizhuo,
.cmt-yuanwy,
.cmt-zhongbo,
.cmt-wangping,
.cmt-chengzhu,
.cmt-yuxiangdou,
.cmt-yannanshang,
.cmt-jiqin{color:rgb(63,107,94);background:linear-gradient(90deg,rgba(63,107,94,0.055),rgba(63,107,94,0) 70%);border-left-color:rgba(63,107,94,0.35);}
.cmt-lizhuo .cmt-tag,
.cmt-yuanwy .cmt-tag,
.cmt-zhongbo .cmt-tag,
.cmt-wangping .cmt-tag,
.cmt-chengzhu .cmt-tag,
.cmt-yuxiangdou .cmt-tag,
.cmt-yannanshang .cmt-tag,
.cmt-jiqin .cmt-tag{color:#6b6155;background:rgba(240,230,209,0.9);}

/* 回前批/序/卷首：底色与墨批一致，保留视觉位置标识，不加浓色块 */
.cmt-block.cmt-preface{}

/* 单条批注内的子分段：不用虚线分隔，换段间距 */
.cmt-sub{margin:2px 0;}
.cmt-sub b{margin-right:4px;font-weight:600;}

/* ======== 批注溯源浮层（Step 12 可信底座） ======== */
.cmt-prov{position:absolute;z-index:60;max-width:340px;background:#fffdf5;border:1px solid #d9c89c;
  border-radius:6px;box-shadow:0 6px 18px rgba(90,70,30,0.18);padding:10px 12px;font-size:12.5px;
  line-height:1.75;color:#4a4033;font-family:var(--font-serif);display:none;pointer-events:none;}
.cmt-prov.on{display:block;}
.cmt-prov .prov-who{font-size:13.5px;font-weight:600;color:#6b4e2c;margin-bottom:4px;}
.cmt-prov .prov-who .pill{margin-left:6px;}
.cmt-prov .prov-row{margin-top:3px;color:#5a4c3e;}
.cmt-prov .prov-row b{color:#6b4e2c;font-weight:600;margin-right:4px;}
.cmt-prov .prov-limits{margin-top:6px;padding-top:6px;border-top:1px dashed #e6dcc1;color:#8a5e19;font-size:12px;}
.cmt-block .cmt-tag{position:relative;cursor:help;}

/* 只看批语模式 */
body.cmt-only .content-wrap>p,
body.cmt-only .content-wrap .poem,
body.cmt-only .content-wrap h3,
body.cmt-only .content-wrap .baihua-block{display:none;}
body.cmt-only .cmt-block{margin:6px 0;padding:4px 0 4px 9px;}

.notice{margin:30px 0;padding:14px 20px;background:#f7f1e1;border-radius:6px;text-align:center;font-size:14px;color:#8a7a62;letter-spacing:1px;font-family:var(--font-serif);line-height:1.8;}
.notice b{color:var(--vermilion,#9c2a2a);}

/* ======== 分页 ======== */
.pager{display:flex;justify-content:space-between;margin-top:50px;padding-top:24px;border-top:1px solid var(--border,#e6dcc4);}
.pager a{padding:10px 24px;background:#fdf3df;border:1px solid var(--border,#e6dcc4);border-radius:6px;color:var(--ink,#3a2a1a);text-decoration:none;font-size:15px;letter-spacing:2px;font-family:var(--font-serif);transition:all .2s;}
.pager a:hover{background:var(--vermilion,#9c2a2a);color:#fdf3df;border-color:var(--vermilion,#9c2a2a);}
.pager a.disabled{color:#c9bfa3;background:#fdf8ee;cursor:not-allowed;pointer-events:none;}

.loading{text-align:center;padding:60px 0;color:var(--ink-muted,#8a7a62);font-family:var(--font-serif);font-size:16px;letter-spacing:4px;}

@media(max-width:760px){
  .read-wrap{padding:14px 16px 60px;}
  .chap-select{min-width:100px;max-width:200px;}
  .chap-title{font-size:24px;letter-spacing:3px;}
  .content-wrap{font-size:16px;}
  .read-header-all .topbar .nav-links a{padding:3px 6px;font-size:12px;}
}

<script>
/* ========== 状态 ========== */
const sp = new URLSearchParams(location.search);
const state = {
  vid: sp.get('vid') || 'v70',
  ch:  parseInt(sp.get('ch') || '0', 10),
  lang: sp.get('lang') || localStorage.getItem('sh_lang') || 'fan',
  hideCmt: sp.get('nocmt')==='1' || localStorage.getItem('sh_nocmt')==='1',  /* 批注随版本自动挂载，只留一个总开关 */
  onlyCmt: sp.get('only')==='1' || localStorage.getItem('sh_only')==='1',
  withBai: sp.get('bai')==='1'  || localStorage.getItem('sh_bai')==='1',
  versions: [], chapters: {},
  comments: {},
  baiCache: {}
};
/* 加载序号：切换版本/回目时递增，用于丢弃「过期」的异步响应，避免旧请求覆盖新页面 */
let reqSeq=0;
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function cnNum(n){
  const c='零一二三四五六七八九';
  function u(m){
    if(m<10)return c[m];
    if(m<20)return '十'+(m%10?c[m%10]:'');
    if(m<100){const t=Math.floor(m/10),r=m%10;return c[t]+'十'+(r?c[r]:'');}
    const h=Math.floor(m/100),r=m%100;return c[h]+'百'+(r===0?'':(r<10?'零'+c[r]:u(r)));
  }
  return u(n);
}

/* 版本简称 / 全名 / 批注元：全部由「注册表」（js/registry.js → data/registry.json）在 boot() 时灌入。
   新增一个版本或批注家，只需改 data/registry.json（+ 补语料目录），本文件无需改动。 */
let VER_SHORT={}, VER_NAME={}, CMT={};
/* 少数批注家的数据抽取逻辑与注册表无关，按 id 绑定保留在代码里 */
const EXTRACT={ jinpi:d=>d.jin70_pi||d.jinpi||d };
function buildMeta(){
  VER_SHORT=Registry.VER_SHORT;
  VER_NAME =Registry.VER_NAME;
  CMT={};
  state.comments={};
  Registry.comments().forEach(c=>{
    CMT[c.id]=Object.assign({},c,{extract:EXTRACT[c.id]||(d=>d)});
    state.comments[c.id]=null;
  });
}

async function loadJSON(p){const r=await fetch(p);if(!r.ok)throw new Error('fail '+p);return r.json();}
async function loadText(p){const r=await fetch(p);if(!r.ok)return null;return r.text();}

async function boot(){
  await Registry.load();                       /* 加载版本/批注注册表（单一可信源） */
  buildMeta();
  /* 版本回退：默认版本若不在注册表内，取第一个 */
  if(!Registry.version(state.vid)){const f=Registry.versions()[0];if(f)state.vid=f.id;}

  const idx = await loadJSON('texts/versions/versions_index.json');
  state.versions = idx.versions;
  const hasData = new Set((idx.versions||[]).map(v=>v.id));

  /* 版本按钮：由注册表生成（顺序/简称/配色均取自注册表） */
  const vg = document.getElementById('verGroup');
  Registry.versions().forEach(v=>{
    const b=document.createElement('button');
    b.className='ui-btn ver-btn'+(v.id===state.vid?' active':'');
    b.dataset.vid=v.id;
    b.textContent=v.short||(v.name||v.id).slice(0,4);
    b.title=(v.name||v.id)+(v.desc?(' · '+v.desc):'');
    if(!hasData.has(v.id)){b.disabled=true;b.classList.add('disabled');b.title+='（语料待补）';}
    b.onclick=()=>{state.vid=v.id;state.ch=1;syncURL();markVer();loadVer().catch(e=>console.error(e));};
    vg.appendChild(b);
  });

  // 语体按钮
  document.querySelectorAll('.lang-btn').forEach(b=>{
    if(b.dataset.lang===state.lang)b.classList.add('active');
    b.onclick=()=>{
      document.querySelectorAll('.lang-btn').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      state.lang=b.dataset.lang;localStorage.setItem('sh_lang',state.lang);loadChap().catch(e=>console.error(e));
    };
  });

  // 勾选：隐藏批注 / 只看批语 / 附白话文
  const ch=document.getElementById('chkHideCmt'), cc=document.getElementById('chkCmtOnly'), cb=document.getElementById('chkBai');
  ch.checked=state.hideCmt; cc.checked=state.onlyCmt; cb.checked=state.withBai;
  ch.parentElement.classList.toggle('on',state.hideCmt);
  cc.parentElement.classList.toggle('on',state.onlyCmt);
  cb.parentElement.classList.toggle('on',state.withBai);
  document.body.classList.toggle('cmt-only',state.onlyCmt);
  ch.onchange=()=>{state.hideCmt=ch.checked;ch.parentElement.classList.toggle('on',state.hideCmt);localStorage.setItem('sh_nocmt',state.hideCmt?'1':'0');loadChap().catch(e=>console.error(e));};
  cc.onchange=()=>{state.onlyCmt=cc.checked;cc.parentElement.classList.toggle('on',state.onlyCmt);localStorage.setItem('sh_only',state.onlyCmt?'1':'0');document.body.classList.toggle('cmt-only',state.onlyCmt);};
  cb.onchange=()=>{state.withBai=cb.checked;cb.parentElement.classList.toggle('on',state.withBai);localStorage.setItem('sh_bai',state.withBai?'1':'0');loadChap().catch(e=>console.error(e));};

  await loadVer(true);
}
function markVer(){document.querySelectorAll('.ver-btn').forEach(b=>b.classList.toggle('active',b.dataset.vid===state.vid));}

async function loadVer(first){
  const vid=state.vid;
  if(!state.chapters[vid]){
    try{
      const raw=await loadJSON('texts/versions/'+vid+'/chapters.json');
      if(state.vid!==vid)return;             /* 载入期间又切了版本，本次作废 */
      state.chapters[vid]=Array.isArray(raw)
        ? {count:raw.length,chapters:raw,version_name:((state.versions.find(v=>v.id===vid)||{}).name||vid)}
        : raw;
    }
    catch(e){
      if(state.vid===vid)document.getElementById('contentWrap').innerHTML='<div class="loading">该版本尚未整理完成</div>';
      return;
    }
  }
  if(state.vid!==vid)return;
  const vc=state.chapters[vid];
  const list=(vc&&Array.isArray(vc.chapters))?vc.chapters:[];
  if(!list.length){document.getElementById('contentWrap').innerHTML='<div class="loading">该版本尚未整理完成</div>';return;}
  const cnt=(vc.count>0)?vc.count:list.length;
  vc.count=cnt;
  if(!(state.ch>=0))state.ch=0;              /* 兼容 URL 上传入非法回次(如 ?ch=abc) */
  if(state.ch>=cnt)state.ch=cnt-1;if(state.ch<0)state.ch=0;

  const sel=document.getElementById('selChap');sel.innerHTML='';
  list.forEach((c,i)=>{
    const o=document.createElement('option');o.value=i;o.textContent=(c.title||'第'+(i+1)+'回');o.title=o.textContent;sel.appendChild(o);
  });
  sel.value=state.ch;
  sel.onchange=()=>{state.ch=parseInt(sel.value,10);syncURL();loadChap().catch(e=>console.error(e));};
  if(!first)syncURL();
  await loadChap();
}
function syncURL(){const u=new URL(location.href);u.searchParams.set('vid',state.vid);u.searchParams.set('ch',state.ch);history.replaceState({},'',u.toString());}

/* 该版本正文本体是否内嵌「」夹批（取自注册表 jinpi.inlineVer）。
   非内嵌版本（如 jin70）的「」是对话引号，必须原样保留，不可当夹批抽走。 */
function verHasInlinePi(){
  const j=CMT['jinpi'];
  return !!(j&&Array.isArray(j.inlineVer)&&j.inlineVer.indexOf(state.vid)>=0);
}
function renderTxt(txt){
  const inlinePi = verHasInlinePi();
  const showJinpi = inlinePi && !state.hideCmt;
  // 第一步：全文级别提取所有「」夹批（支持跨行跨段，使用非贪婪匹配）
  // 用占位符替换，避免分段把夹批切断
  const piStore = [];
  const piRe = /「([^」]+?)」/g;
  let cleaned = txt;
  if(inlinePi){
    if(showJinpi){
      cleaned = cleaned.replace(piRe, (m,c)=>{
        const idx = piStore.length;
        piStore.push(c);
        return `\u0000PI${idx}\u0000`;
      });
    } else {
      // 隐藏批注模式：删除内嵌夹批标记（支持跨行跨段）
      cleaned = cleaned.replace(/「[\s\S]+?」/g,'');
    }
  }
  // 非内嵌版本：正文「」为对话引号，原样保留
  // 第二步：段落拆分（按双换行）
  const bs=cleaned.split(/\n\s*\n/);
  let h='';
  bs.forEach(b=>{
    b=b.trim();if(!b)return;
    const rawLs=b.split(/\n/).map(l=>l.trim()).filter(Boolean);
    // 诗块判定
    const poem=rawLs.length>=2&&rawLs.every(l=>l.length<30)&&(/诗|曰|词|古风|偈|吟|赋|歌/.test(rawLs[0])||rawLs.every(l=>/[，。？！,?.!]$/.test(l)));
    if(poem){
      let ph='';
      rawLs.forEach(l=>{
        // 替换占位符为夹批块（诗行后追加批语）
        let line = l.replace(/\u0000PI(\d+)\u0000/g,(m,i)=>{
          const c=piStore[parseInt(i)];
          c.split(/[○●]\s*|\n+/).filter(x=>x.trim()).forEach(t=>{
            ph+=`<div class="cmt-block cmt-jinpi"><span class="cmt-tag">夹批</span>${esc(t.trim())}</div>`;
          });
          return '';
        });
        if(line) ph+='<p>'+esc(line)+'</p>';
      });
      h+='<div class="poem">'+ph+'</div>';
    }
    else if(/^第[一二三四五六七八九十百零]+回|^楔子|^引首/.test(rawLs[0])&&rawLs[0].length<40){
      let t=rawLs.join(' ').replace(/\u0000PI\d+\u0000/g,'').replace(/\s+/g,' ').trim();
      h+='<h3>'+esc(t)+'</h3>';
    }
    else {
      rawLs.forEach(l=>{
        let piHtml='';
        let line = l.replace(/\u0000PI(\d+)\u0000/g,(m,i)=>{
          const c=piStore[parseInt(i)];
          c.split(/[○●]\s*|\n+/).filter(x=>x.trim()).forEach(t=>{
            piHtml+=`<div class="cmt-block cmt-jinpi"><span class="cmt-tag">夹批</span>${esc(t.trim())}</div>`;
          });
          return '';
        });
        if(line) h+='<p>'+esc(line)+'</p>';
        if(piHtml) h+=piHtml;
      });
    }
  });
  return h;
}

async function loadChap(){
  const vid=state.vid,ch=state.ch;
  const vc=state.chapters[vid];
  const list=(vc&&Array.isArray(vc.chapters))?vc.chapters:[];
  const chap=list[ch];
  const wrap=document.getElementById('contentWrap');
  if(!chap){
    document.getElementById('chapTitle').textContent='—';
    document.getElementById('chapVer').textContent=(vc&&vc.version_name)||'';
    wrap.innerHTML='<div class="loading">章节列表为空，请切换版本</div>';
    updPgr();return;
  }
  const my=++reqSeq;                         /* 本次加载的序号 */
  document.getElementById('chapTitle').textContent=chap.title;
  document.getElementById('chapVer').textContent=vc.version_name;
  wrap.innerHTML='<div class="loading">正在载入正文…</div>';
  const swap=(f,lang)=>!f?null:(f.indexOf('/')>=0?f.replace(/^fan\//,lang+'/'):lang+'/'+f);
  const fn = state.lang==='jian' ? (chap.file_simp||swap(chap.file,'jian'))
           : state.lang==='bai'  ? (chap.file_bai ||swap(chap.file,'bai'))
           : chap.file;
  if(!fn){wrap.innerHTML='<div class="loading">无此回正文</div>';updPgr();return;}
  const fp='texts/versions/'+vid+'/'+fn;
  const txt=await loadText(fp);
  if(my!==reqSeq||state.vid!==vid||state.ch!==ch)return;   /* 期间已切换版本/回目，丢弃过期正文 */
  if(!txt){wrap.innerHTML='<div class="loading">该版本此语体暂未整理<br><small>'+esc(fp)+'</small></div>';updPgr();return;}

  let baiH='';
  if(state.withBai&&state.lang!=='bai'){
    const bf='texts/versions/'+vid+'/'+(chap.file_bai||swap(chap.file,'bai'));
    let bt=state.baiCache[bf];
    if(bt===undefined){bt=await loadText(bf);state.baiCache[bf]=bt;}
    if(my!==reqSeq||state.vid!==vid||state.ch!==ch)return;
    if(bt)baiH='<div class="baihua-block"><span class="baihua-label">白话译文</span>'+esc(bt).replace(/\n\s*\n/g,'<br><br>').replace(/\n/g,'')+'</div>';
  }

  wrap.innerHTML=renderTxt(txt)+baiH;
  updPgr();applyCmt(my);
}

function updPgr(){
  const vc=state.chapters[state.vid];
  const cnt=(vc&&((vc.count>0&&vc.count)||(Array.isArray(vc.chapters)&&vc.chapters.length)))||0;
  const pr=state.ch-1,nx=state.ch+1;
  let h='';
  h+=pr>=0?`<a href="#" onclick="go(${pr});return false;">← 上一回</a>`:`<a class="disabled">← 上一回</a>`;
  h+=(cnt&&nx<cnt)?`<a href="#" onclick="go(${nx});return false;">下一回 →</a>`:`<a class="disabled">下一回 →</a>`;
  const pg=document.getElementById('pager');if(pg)pg.innerHTML=h;
}
function go(n){
  const vc=state.chapters[state.vid];
  const cnt=(vc&&((vc.count>0&&vc.count)||(Array.isArray(vc.chapters)&&vc.chapters.length)))||0;
  state.ch=Math.max(0,cnt?Math.min(n,cnt-1):n);syncURL();
  const sel=document.getElementById('selChap');if(sel)sel.value=state.ch;
  loadChap().catch(e=>console.error(e));window.scrollTo(0,0);
}

/* ========== 批注 ========== */
/* 当前版本适用的批注家（由注册表 okVer 决定）——不再由用户选择 */
function cmtIdsForVer(){
  if(state.hideCmt) return [];
  return Registry.commentsFor(state.vid).map(c=>c.id);
}
async function applyCmt(my){
  // 清理旧批注块，但保留正文内嵌的金批夹批（renderTxt 依 inlineVer 渲染为 cmt-jinpi）
  document.querySelectorAll('.cmt-block:not(.cmt-jinpi),.notice').forEach(e=>e.remove());
  for(const id of cmtIdsForVer()){
    await applyOneCmt(id, my);
    if(my!==undefined && my!==reqSeq) return;   /* 正文已换，放弃过期批注 */
  }
}
async function applyOneCmt(cmtId, my){
  const m=CMT[cmtId]; if(!m) return;
  if(!m.okVer.includes(state.vid)) return;      /* 版本不适用（理论上已被 commentsFor 过滤） */
  if(!state.comments[cmtId]){
    try{state.comments[cmtId]=await loadJSON('texts/versions/'+m.file);}catch(e){state.comments[cmtId]=null;}
  }
  if(my!==undefined&&my!==reqSeq)return;
  const data=state.comments[cmtId];
  if(!data){notice('加载'+m.who+'批失败。');return;}

  const wrap=document.getElementById('contentWrap');
  const blocks=[];

  if(cmtId==='jinpi'){
    // 金批夹批已由 renderTxt 从正文「」渲染为段间 cmt-jinpi 块，
    // 这里只把 comments.json 的回前总批（preface）插到正文最前。
    const sub=m.extract(data);
    let ch=sub[String(state.ch)];
    if(!ch)for(const k of [String(state.ch-1),String(state.ch+1)]){if(sub[k]&&sub[k].preface){ch=sub[k];break;}}
    if(ch&&ch.preface){
      const d=document.createElement('div');
      d.className='cmt-block cmt-jinpi cmt-preface';
      d.innerHTML='<span class="cmt-tag">回前批</span>'+esc(ch.preface).replace(/\n/g,'<br>');
      const fc=wrap.firstElementChild;
      if(fc) fc.parentElement.insertBefore(d,fc); else wrap.appendChild(d);
    }
    return;
  }
  if(cmtId==='lizhuo'||cmtId==='yuanwy') collectChapters(data,m,blocks);
  else if(cmtId==='wangping') collectWangping(data,m,blocks);
  else if(cmtId==='zhongbo') collectZhongbo(data,m,blocks);
  else if(cmtId==='chengzhu') collectChengzhu(data,m,blocks);
  else if(cmtId==='yuxiangdou') collectYuxiangdou(data,m,blocks);
  else if(cmtId==='yannanshang') collectYannanshang(data,m,blocks);
  else collectDict(data,m,blocks);

  if(blocks.length===0)return;   /* 多家叠加时静默，不逐家提示 */

  insertBlocks(wrap,m,blocks);
}
/* 把某一家批注的 blocks 插入正文（回前 / 段间 / 卷末） */
function insertBlocks(wrap,m,blocks){
  /* 把 blocks 拆成三类：top（回前）/ mid（夹批 / 回中）/ tail（卷末说明） */
  const top=[], mid=[], tail=[];
  blocks.forEach(b=>{
    const items=splitBlockToItems(b);
    items.forEach(it=>{
      if(b.where==='top'||b.preface) top.push(it);
      else if(b.tail) tail.push(it);
      else mid.push(it);
    });
  });

  /* 回前批：插到正文第一个元素（标题/段落/诗）之前 */
  if(top.length){
    const firstChild=wrap.firstElementChild;
    top.reverse().forEach(it=>{
      const d=makeAnno(m,it);
      if(firstChild) firstChild.parentElement.insertBefore(d,firstChild);
      else wrap.appendChild(d);
    });
  }

  /* 夹批/回评：沿正文段落之间均匀散开（仿红楼段间嵌入） */
  if(mid.length){
    const ps=[...wrap.children].filter(el=>el.matches('p,.poem')&&el.offsetParent!==null&&!el.closest('.cmt-block,.baihua-block'));
    /* 条目远多于段落数（名物注/大量条目）时，收束到正文末尾，不摊满段间 */
    if(mid.length>ps.length*1.5){
      const last=[...wrap.children].filter(el=>!el.matches('.cmt-block,.notice')).pop();
      let anchor=last;
      mid.forEach(it=>{
        const d=makeAnno(m,it);
        if(anchor) anchor.insertAdjacentElement('afterend',d);
        else wrap.appendChild(d);
        anchor=d;
      });
    }else{
      distributeBlocks(wrap,m,mid,ps);
    }
  }

  /* 卷末说明 / 录文提示：统一贴到正文最后一个元素之后 */
  if(tail.length){
    const last=[...wrap.children].filter(el=>!el.matches('.cmt-block,.notice')).pop();
    tail.forEach(it=>{
      const d=makeAnno(m,it);
      if(last) last.insertAdjacentElement('afterend',d);
      else wrap.appendChild(d);
    });
  }
}
/* 把一个 block（可能含多条 cmt-sub）拆成独立的单条批注项 */
function splitBlockToItems(b){
  /* 若 block.html 本身无 cmt-sub 子项，就直接当一条 */
  const tmp=document.createElement('div'); tmp.innerHTML=b.html;
  const subs=tmp.querySelectorAll('.cmt-sub');
  if(subs.length===0){
    return [{tag:b.tag, html:b.html, preface:b.preface}];
  }
  /* 把 tmp 里每个 .cmt-sub 提成独立条；其前置说明文本（块首的裸文本）单独做一条 */
  const out=[];
  /* 处理第一个 cmt-sub 之前的「块首说明」 */
  const first=subs[0];
  let head='';
  for(let n=tmp.firstChild;n&&n!==first;n=n.nextSibling){head+=n.nodeType===3?n.textContent.trim():n.outerHTML||'';}
  if(head.trim()) out.push({tag:b.tag, html:head.trim(), preface:b.preface});
  subs.forEach(s=>out.push({tag:b.tag, html:s.outerHTML, preface:false}));
  return out;
}
/* 构造一个红楼风格的段间批注块：左彩线 + 米色小标签 */
function makeAnno(m,it){
  const d=document.createElement('div');
  /* 金批整体用「朱批」色；其他八家统一「墨批」色 */
  const cmtType = (m.cls==='cmt-jinpi') ? '朱批' : '墨批';
  d.className='cmt-block '+m.cls+(it.preface?' cmt-preface':'');
  d.innerHTML='<span class="src cmt-tag" data-cmt="'+esc(m.id)+'">'+esc(it.tag)+'</span><span class="cmt-text">'+it.html+'</span>';
  return d;
}

/* ========== 批注溯源卡（Step 12 可信底座） ========== */

const REL_TEXT={'A':'精校','B':'待校','C':'转引','D':'序跋'};
const REL_COLOR={'A':'#2a6a3f','B':'#8a5e19','C':'#a64b1e','D':'#5d3a7a'};

function ensureProvEl(){

function showProv(anchor, cmtId){

document.addEventListener('mouseover', e=>{

loadCmtMeta();
/* 把一组批注均匀分配到正文段落之间 */
function distributeBlocks(wrap,m,items,ps){
  if(!ps.length){
    /* 没有段落可插入时，全部追加到末尾 */
    items.forEach(it=>wrap.appendChild(makeAnno(m,it)));
    return;
  }
  const n=ps.length;
  /* 若只有 1 条，放第一段之后；若条数 ≥ 段落数，每段后放一条；否则均匀散布 */
  if(items.length===1){
    ps[0].insertAdjacentElement('afterend',makeAnno(m,items[0]));
    return;
  }
  /* 算法：把每条批注放到第 ceil(i*(n-1)/items.length) 段之后，并按段内倒序插，保持顺序 */
  const byPos=new Array(n).fill(null).map(()=>[]);
  items.forEach((it,i)=>{
    const idx = Math.min(n-1, Math.floor(i*(n-1)/Math.max(1,items.length-1)));
    byPos[idx].push(it);
  });
  for(let i=0;i<n;i++){
    if(byPos[i].length===0) continue;
    let anchor=ps[i];
    byPos[i].forEach(it=>{
      const d=makeAnno(m,it);
      anchor.insertAdjacentElement('afterend',d);
      anchor=d;
    });
  }
}
function notice(h){const d=document.createElement('div');d.className='notice';d.innerHTML=h;document.getElementById('contentWrap').appendChild(d);}

function collectDict(data,m,blocks){
  const sub=m.extract(data);
  let ch=sub[String(state.ch)];
  if(!ch)for(const k of [String(state.ch-1),String(state.ch+1)]){if(sub[k]&&sub[k].preface){ch=sub[k];break;}}
  if(!ch)return;
  if(ch.preface){
    blocks.push({where:'top',tag:m.tag+'·回前批',preface:true,html:esc(ch.preface).replace(/\n/g,'<br>')});
  }
  const keys=Object.keys(ch).filter(k=>k!=='preface'&&k!=='inline_count'&&ch[k]);
  if(keys.length){
    const items=[];
    keys.forEach((k,i)=>{
      const v=ch[k];
      if(typeof v==='string')items.push('<div class="cmt-sub"><b style="color:'+m.color+';">〔'+(i+1)+'〕</b>'+esc(v)+'</div>');
      else if(v&&typeof v==='object')Object.entries(v).forEach(([kk,vv])=>{items.push('<div class="cmt-sub"><b style="color:'+m.color+';">〔'+(i+1)+'·'+esc(kk)+'〕</b>'+esc(String(vv))+'</div>');});
    });
    const label = m.id==='jiqin'?m.tag+'·名物注释':m.tag+'·夹批';
    blocks.push({where:'bottom',tag:label,html:items.join('')});
  }
}

function collectChapters(data,m,blocks){
  const cur=state.chapters[state.vid].chapters[state.ch];
  const tgt=state.ch===0?null:'第'+cnNum(state.ch)+'回';
  let firstMatch=null;
  if(state.ch===0&&/引首|楔子|张天师/.test(cur.title||''))firstMatch=data.chapters.find(c=>c.chapter==='引首+第一回');
  if(!firstMatch)firstMatch=data.chapters.find(c=>c.chapter&&c.chapter===tgt)||data.chapters.find(c=>c.chapter==='全书');

  // 序文（前2回显示）
  if(state.ch<=1){
    data.chapters.forEach(c=>{(c.preface_comments||[]).forEach(p=>{
      blocks.push({where:'top',tag:m.tag+'·序',preface:true,html:'<div style="font-size:13px;color:#8a7a62;margin-bottom:6px;">—— '+esc(p.author||m.who)+'《'+esc(p.source||'评点')+'》</div>'+esc(p.text).replace(/\n/g,'<br>')});
    });});
  }
  if(firstMatch){
    const cms=firstMatch.chapter_comments||[];
    if(cms.length){
      blocks.push({where:'bottom',tag:m.tag+'·回评',html:cms.map(c=>{
        const lab=c.type==='回末总评'?'回末总评':(c.type==='眉批'?'眉批':(c.type==='旁批'?'旁批':(c.type==='夹批'?'夹批':c.type||'评')));
        return '<div class="cmt-sub"><b style="color:'+m.color+';">〔'+lab+(c.anchor?'·'+esc(c.anchor):'')+'〕</b>'+esc(c.text)+'</div>';
      }).join('')});
    }
  }
  if(state.ch<=1&&data.art_theory&&data.art_theory.length){
    blocks.push({where:'bottom',tag:m.tag+'·读法',html:data.art_theory.map(a=>'<div class="cmt-sub"><b style="color:'+m.color+';">「'+esc(a.keyword)+'」</b>（'+esc(a.source)+'）：'+esc(a.point)+'</div>').join('')});
  }
}

/* —— 王望如：逐回「王望如曰」回末总评 —— */
function collectWangping(data,m,blocks){
  const cur=state.chapters[state.vid].chapters[state.ch];
  const num=(cur&&cur.num!=null)?cur.num:state.ch;
  const tgt='第'+num+'回';
  const hits=(data.chapters||[]).filter(c=>c.chapter===tgt);
  if(!hits.length)return;
  blocks.push({where:'bottom',tag:m.tag+'·回末总评',html:hits.map(c=>
    '<div class="cmt-sub"><b style="color:'+m.color+';">〔'+esc(c.vol||'')+'·'+esc(c.type||'总评')+'〕</b>'+esc(c.text)+'</div>').join('')});
}

/* —— 钟伯敬：卷首《水浒传人品评》 —— */
function collectZhongbo(data,m,blocks){
  const cur=state.chapters[state.vid].chapters[state.ch];
  const num=(cur&&cur.num!=null)?cur.num:(state.ch<1?1:state.ch);
  if(num<=1){
    const items=(data.pin_ren||[]).map(p=>'<div class="cmt-sub"><b style="color:'+m.color+';">『'+esc(p.name)+'』</b>'+esc(p.text)+'</div>').join('');
    blocks.push({where:'top',tag:m.tag+'·卷首人品评',preface:true,
      html:'<div class="cmt-sub" style="font-size:13px;color:#8a7a62;">—— 明·钟惺（字伯敬）《水浒传人品评》　四知馆刊本卷首</div>'+items+
           '<div class="cmt-sub" style="font-size:12.5px;color:#8a7a62;">（钟批本眉批、侧批传世录文与正文混排过甚，暂不成层）</div>'});
  }
  const ch=(data.chapters||[]).find(c=>c.num===num);
  if(ch&&ch.items&&ch.items.length){
    blocks.push({where:'bottom',tag:m.tag+'·回后总评',html:ch.items.map(it=>
      '<div class="cmt-sub"><b style="color:'+m.color+';">〔'+esc(it.k||'批语')+'〕</b>'+esc(it.v)+'</div>').join('')});
  }
}
/* —— 燕南尚生《新评水浒传》：卷首三篇（叙 / 新或问 / 命名释义） —— */
function collectYannanshang(data,m,blocks){
  const cur=state.chapters[state.vid].chapters[state.ch];
  const num=(cur&&cur.num!=null)?cur.num:(state.ch<1?1:state.ch);
  if(state.ch>0&&num>1)return;   /* 卷首三篇：挂该版本首条｜回次≤1 */
  let html='<div style="font-size:13px;color:#8a7a62;margin-bottom:6px;">—— 清光绪三十四年（1908）直隶官书局、保定大有山房排印本《新评水浒传》卷首　凡三篇</div>';
  /* 〈一〉新评水浒传叙 */
  if(data.xu){
    html+='<div class="cmt-sub"><b style="color:'+m.color+';">〈一〉'+esc(data.xu.title)+'　'+esc(data.xu.genre||'全书总论')+'　'+esc(data.xu.status||'全篇')+'</b>'+esc(data.xu.text)+'</div>';
  }
  /* 〈二〉水浒传新或问 */
  if(data.huowen){
    const h=data.huowen;
    html+='<div class="cmt-sub"><b style="color:'+m.color+';">〈二〉'+esc(h.title)+'　'+esc(h.genre||'问答体')+'　'+esc(h.status||'')+'</b>'+esc(h.note||'')+'</div>';
    (h.excerpts||[]).forEach(e=>{
      html+='<div class="cmt-sub"><b style="color:'+m.color+';">〔存世引文〕</b>'+esc(e.text)+(e.cite?'<span style="font-size:12px;color:#8a7a62;">（'+esc(e.cite)+'）</span>':'')+'</div>';
    });
  }
  /* 〈三〉水浒传命名释义 */
  if(data.shiming&&data.shiming.length){
    html+='<div class="cmt-sub"><b style="color:'+m.color+';">〈三〉水浒传命名释义　名号索解　凡'+data.shiming.length+'则</b></div>';
    data.shiming.forEach(x=>{html+='<div class="cmt-sub"><b style="color:'+m.color+';">〔命名释义·'+esc(x.name)+'〕</b>'+esc(x.text)+'</div>';});
  }
  blocks.push({where:'top',tag:m.tag+'·卷首',preface:true,html:html});
}

/* —— 程穆衡《水浒传注略》：名物训注，按回为扁平dict{no:"词条——释义"} —— */
function collectChengzhu(data,m,blocks){
  const ch=data[String(state.ch)];
  if(!ch)return;
  const keys=Object.keys(ch).filter(k=>/^\d+$/.test(k)&&ch[k]);
  if(!keys.length)return;
  // 按注号数字序
  keys.sort((a,b)=>+a-+b);
  const items=keys.map((k,i)=>{
    let v=ch[k];
    // 词条/释义分隔：优先找"——"；否则词条通常是开头2-8个汉字（到第一个空格/标点或补字标记前）
    let head='注'+k, body=v;
    let sep=v.search(/[—–-]{2}/);
    if(sep<0){
      // 匹配开头词条（含"补"标记，如"过街老鼠 补 ..."）
      let m=v.match(/^([\u4e00-\u9fa5A-Za-z0-9·《》"']{1,18})(?:\s+|\.)(补\s*)?([\s\S]*)$/);
      if(m){ head=m[1]+(m[2]?'〔补〕':''); body=(m[3]||'').trim(); }
    }else{
      head=v.slice(0,sep).trim();
      body=v.slice(sep).replace(/^[—\-]+/,'').trim();
    }
    return '<div class="cmt-sub"><b style="color:'+m.color+';">〔'+esc(head)+'〕</b>'+esc(body)+'</div>';
  });
  blocks.push({where:'bottom',tag:m.tag+'·名物训注',html:items.join('')+
    '<div class="cmt-sub" style="font-size:12px;color:#8a7a62;">（《水浒传注略》依金七十回本编排，原注条目序与回次对应；缺第六、十六、六十九、七十回四卷，系源站缺页）</div>'});
}

/* —— 余象斗《水浒志传评林》：卷首叙 + 上栏评语（按卷对应回次） —— */
function collectYuxiangdou(data,m,blocks){
  const cur=state.chapters[state.vid].chapters[state.ch];
  const num=(cur&&cur.num!=null)?cur.num:(state.ch<1?1:state.ch);
  if(num<=1&&data.preface){
    blocks.push({where:'top',tag:m.tag+'·卷首叙',preface:true,
      html:'<div style="font-size:13px;color:#8a7a62;margin-bottom:6px;">—— 明·余象斗《'+esc(data.preface.title)+'》　双峰堂刊本卷首</div>'+esc(data.preface.text)});
  }
  if(num<=1&&data.bian){
    blocks.push({where:'bottom',tag:m.tag+'·水浒辨',html:'<div style="font-size:13px;color:#8a7a62;margin-bottom:6px;">—— '+esc(data.bian.title)+'</div>'+esc(data.bian.text)});
  }
  const no=num<1?1:num;
  const vols=data.volumes||[];
  const vol=vols.find(v=>no>=v.hui[0]&&no<=v.hui[1]);
  if(vol&&vol.items&&vol.items.length){
    blocks.push({where:'bottom',tag:m.tag+'·上栏评语（'+vol.name+'）',html:vol.items.map((it,i)=>
      '<div class="cmt-sub"><b style="color:'+m.color+';">〔'+(i+1)+'〕</b>'+esc(it)+'</div>').join('')+
      '<div class="cmt-sub" style="font-size:12px;color:#8a7a62;">（评林本上栏评语原为孤本影印，此处系机器录文，残损字存原样）</div>'});
  }else{
    const cov=(data.coverage&&data.coverage.vols_with_comments)||[];
    const names=(data.volumes||[]).filter(v=>cov.indexOf(v.no)>=0).map(v=>v.name).join('、');
    if(names){
      blocks.push({where:'bottom',tail:true,tag:m.tag+'·录文说明',html:'<div class="cmt-sub" style="font-size:12.5px;color:#8a7a62;">评林本上栏评语系孤本影印＋机器录文，现仅 <b>'+esc(names)+'</b> 切分完整、可校读；其余各卷评语在录文中与下栏正文混排、残缺过甚，暂缺。</div>'});
    }
  }
}
