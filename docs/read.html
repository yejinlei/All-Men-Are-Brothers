<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>水浒传 · 版本阅读器</title>
<link rel="stylesheet" href="css/style.css">
<style>
/* ========== 阅读器专属 ========== */
.read-wrap{max-width:860px;margin:0 auto;padding:140px 24px 80px;font-family:var(--font-serif,"KaiTi","STKaiti",serif);}

/* ======== 顶部工具栏（仿红楼梦参考图） ======== */
.read-top{position:fixed;top:0;left:0;right:0;background:rgba(253,248,238,0.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--border,#e6dcc4);z-index:50;}
.read-top-inner{max-width:860px;margin:0 auto;padding:14px 24px;display:flex;flex-wrap:wrap;align-items:center;gap:12px 22px;font-size:15px;color:var(--ink,#3a2a1a);}
.read-top .brand{font-weight:700;font-size:18px;color:var(--vermilion,#9c2a2a);cursor:pointer;letter-spacing:4px;margin-right:8px;}
.read-top .brand:hover{color:#c0392b;}

.tool-group{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.tool-label{color:var(--ink-muted,#8a7a62);letter-spacing:2px;font-size:15px;}

/* 回目下拉 */
.chap-select{appearance:none;background:#fdf3df;border:1px solid var(--border,#e6dcc4);border-radius:6px;padding:7px 34px 7px 14px;font-family:var(--font-serif);font-size:15px;color:var(--ink,#3a2a1a);cursor:pointer;min-width:260px;max-width:460px;
background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path d='M1 1l5 5 5-5' stroke='%238a7a62' stroke-width='1.5' fill='none' stroke-linecap='round'/></svg>");
background-repeat:no-repeat;background-position:right 12px center;}
.chap-select:focus{outline:none;border-color:var(--vermilion,#9c2a2a);}

/* 通用按钮组 */
.btn-group{display:inline-flex;gap:4px;flex-wrap:wrap;}
.ui-btn{padding:6px 14px;background:transparent;border:1px solid var(--border,#e6dcc4);border-radius:6px;font-family:var(--font-serif);font-size:15px;color:var(--ink,#3a2a1a);cursor:pointer;transition:all .2s;letter-spacing:1px;}
.ui-btn:hover{background:#fdf3df;border-color:#d9cba5;}

/* 版本按钮 */
.ver-btn.active{background:var(--vermilion,#9c2a2a);color:#fdf3df;border-color:var(--vermilion,#9c2a2a);box-shadow:0 2px 6px rgba(156,42,42,0.15);}

/* 语体按钮 */
.lang-btn.active{background:#5a4632;color:#fdf3df;border-color:#5a4632;}

/* 批注按钮 */
.cmt-btn.active{background:#fff;box-shadow:0 2px 6px rgba(0,0,0,0.06);font-weight:700;}
.cmt-btn.active.cm-none{background:#eee;color:#888;border-color:#ccc;}
.cmt-btn.active.cm-jinpi{color:#b8860b;background:#fff8e6;border-color:#d4a83b;}
.cmt-btn.active.cm-lizhuo{color:#8b4513;background:#faf1e7;border-color:#a96639;}
.cmt-btn.active.cm-yuanwy{color:#2e5a88;background:#eef3f8;border-color:#4a7aa8;}
.cmt-btn.active.cm-jiqin{color:#4a7a49;background:#eef5ec;border-color:#6b9a6a;}

/* 勾选开关（仿红楼梦参考图） */
.chk{display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-size:15px;color:var(--ink-muted,#8a7a62);user-select:none;}
.chk input[type=checkbox]{appearance:none;-webkit-appearance:none;width:18px;height:18px;border:2px solid var(--border,#c9bfa3);border-radius:3px;background:#fdf8ee;cursor:pointer;position:relative;transition:all .15s;vertical-align:middle;margin:0;}
.chk input[type=checkbox]:checked{background:var(--vermilion,#9c2a2a);border-color:var(--vermilion,#9c2a2a);}
.chk input[type=checkbox]:checked::after{content:"";position:absolute;left:4px;top:1px;width:5px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg);}
.chk:hover{color:var(--ink,#3a2a1a);}

/* ======== 正文区 ======== */
.chap-title{font-size:28px;font-weight:700;text-align:center;color:var(--vermilion-deep,#261810);margin:10px 0 6px;letter-spacing:6px;font-family:var(--font-serif);}
.chap-ver{text-align:center;color:var(--ink-muted,#8a7a62);font-size:13px;letter-spacing:3px;margin-bottom:28px;padding-bottom:18px;border-bottom:1px solid var(--border,#e6dcc4);}

.content-wrap{font-size:18px;line-height:2;color:var(--ink,#3a2a1a);}
.content-wrap p{margin:0;text-indent:2em;margin-bottom:4px;}
.content-wrap h3{font-size:22px;text-align:center;margin:30px 0 18px;letter-spacing:4px;color:var(--vermilion-deep,#261810);font-weight:700;}
.content-wrap .poem{margin:20px auto;padding:18px 28px;background:#f9f0d9;border-left:3px solid #c5a868;border-radius:0 4px 4px 0;text-align:center;font-size:16px;line-height:2;color:var(--ink-light,#5a4632);max-width:480px;}
.content-wrap .poem p{text-indent:0;margin:2px 0;}

/* 白话文附段 */
.baihua-block{margin:20px 0 28px;padding:16px 22px;background:#f0efe6;border-left:3px solid #94a38a;border-radius:0 4px 4px 0;font-size:16px;line-height:2;color:#4a5240;}
.baihua-block .baihua-label{display:inline-block;background:#94a38a;color:#fff;font-size:12px;padding:2px 8px;border-radius:3px;margin-right:10px;letter-spacing:2px;font-family:var(--font-serif);vertical-align:middle;}

/* ======== 批注块（仿红楼梦参考图：标签 + 左侧彩色竖线） ======== */
.cmt-block{margin:12px 0;padding:10px 16px 10px 18px;border-radius:0 6px 6px 0;font-size:15px;line-height:1.95;color:var(--ink-light,#5a4632);font-family:var(--font-serif);position:relative;}
.cmt-block::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:2px;}
.cmt-block .cmt-tag{display:inline-block;padding:1px 10px;border-radius:12px;font-size:12px;font-weight:700;margin-right:10px;letter-spacing:1px;vertical-align:1px;color:#fff;font-family:var(--font-serif);}
.cmt-block .cmt-text{white-space:pre-wrap;}

/* 金圣叹（金色/朱红，仿"庚辰"批） */
.cmt-jinpi{background:#fdf5e3;}
.cmt-jinpi::before{background:#8b1a1a;}
.cmt-jinpi .cmt-tag{background:#8b1a1a;}

/* 李卓吾/容与堂（赭石） */
.cmt-lizhuo{background:#faf1e7;}
.cmt-lizhuo::before{background:#8b4513;}
.cmt-lizhuo .cmt-tag{background:#8b4513;}

/* 袁无涯（青蓝） */
.cmt-yuanwy{background:#eef3f8;}
.cmt-yuanwy::before{background:#2e5a88;}
.cmt-yuanwy .cmt-tag{background:#2e5a88;}

/* 冀勤校注（竹青） */
.cmt-jiqin{background:#eef5ec;}
.cmt-jiqin::before{background:#2f5d50;}
.cmt-jiqin .cmt-tag{background:#2f5d50;}

/* 回前批/序 深色底强调 */
.cmt-block.cmt-preface{background:#f5ead0;}
.cmt-sub{margin:6px 0;padding:6px 0;border-top:1px dashed rgba(0,0,0,0.1);}
.cmt-sub b{margin-right:6px;}

/* 只看批语模式 */
body.cmt-only .content-wrap>p,
body.cmt-only .content-wrap .poem,
body.cmt-only .content-wrap h3,
body.cmt-only .content-wrap .baihua-block{display:none;}
body.cmt-only .cmt-block{margin:18px 0;}

.notice{margin:30px 0;padding:14px 20px;background:#f7f1e1;border-radius:6px;text-align:center;font-size:14px;color:#8a7a62;letter-spacing:1px;font-family:var(--font-serif);line-height:1.8;}
.notice b{color:var(--vermilion,#9c2a2a);}

/* ======== 分页 ======== */
.pager{display:flex;justify-content:space-between;margin-top:50px;padding-top:24px;border-top:1px solid var(--border,#e6dcc4);}
.pager a{padding:10px 24px;background:#fdf3df;border:1px solid var(--border,#e6dcc4);border-radius:6px;color:var(--ink,#3a2a1a);text-decoration:none;font-size:15px;letter-spacing:2px;font-family:var(--font-serif);transition:all .2s;}
.pager a:hover{background:var(--vermilion,#9c2a2a);color:#fdf3df;border-color:var(--vermilion,#9c2a2a);}
.pager a.disabled{color:#c9bfa3;background:#fdf8ee;cursor:not-allowed;pointer-events:none;}

.loading{text-align:center;padding:60px 0;color:var(--ink-muted,#8a7a62);font-family:var(--font-serif);font-size:16px;letter-spacing:4px;}

@media(max-width:760px){
  .read-wrap{padding:180px 16px 60px;}
  .chap-select{min-width:0;max-width:100%;width:100%;}
  .chap-title{font-size:24px;letter-spacing:3px;}
  .content-wrap{font-size:16px;}
}
</style>
</head>
<body>
<div class="read-wrap">
  <div class="read-top">
    <div class="read-top-inner">
      <span class="brand" onclick="location.href='index.html'">水浒传</span>

      <span class="tool-group">
        <span class="tool-label">回目：</span>
        <select id="selChap" class="chap-select"></select>
      </span>

      <span class="tool-group">
        <span class="tool-label">版本：</span>
        <span class="btn-group" id="verGroup"></span>
      </span>

      <span class="tool-group">
        <span class="tool-label">语体：</span>
        <span class="btn-group">
          <button class="ui-btn lang-btn" data-lang="fan">繁</button>
          <button class="ui-btn lang-btn" data-lang="jian">简</button>
          <button class="ui-btn lang-btn" data-lang="bai">白</button>
        </span>
      </span>

      <span class="tool-group">
        <span class="tool-label">批注：</span>
        <span class="btn-group" id="cmtGroup">
          <button class="ui-btn cmt-btn cm-none" data-cmt="none">关闭</button>
          <button class="ui-btn cmt-btn cm-jinpi" data-cmt="jinpi">金批</button>
          <button class="ui-btn cmt-btn cm-lizhuo" data-cmt="lizhuo">容本</button>
          <button class="ui-btn cmt-btn cm-yuanwy" data-cmt="yuanwy">袁本</button>
          <button class="ui-btn cmt-btn cm-jiqin" data-cmt="jiqin">冀注</button>
        </span>
      </span>

      <span class="tool-group">
        <label class="chk"><input type="checkbox" id="chkCmtOnly">只看批语</label>
        <label class="chk"><input type="checkbox" id="chkBai">附白话文</label>
      </span>
    </div>
  </div>

  <h1 class="chap-title" id="chapTitle">加载中…</h1>
  <div class="chap-ver" id="chapVer"></div>

  <div class="content-wrap" id="contentWrap">
    <div class="loading">正在载入正文…</div>
  </div>

  <div class="pager" id="pager"></div>
</div>

<script>
/* ========== 状态 ========== */
const sp = new URLSearchParams(location.search);
const state = {
  vid: sp.get('vid') || 'v70',
  ch:  parseInt(sp.get('ch') || '1', 10),
  lang: localStorage.getItem('sh_lang') || 'fan',
  cmt:  localStorage.getItem('sh_cmt')  || 'jinpi',
  onlyCmt: localStorage.getItem('sh_only')==='1',
  withBai: localStorage.getItem('sh_bai')==='1',
  versions: [], chapters: {},
  comments: { jinpi:null, jiqin:null, lizhuo:null, yuanwy:null },
  baiCache: {}
};
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function cnNum(n){const c=['零','一','二','三','四','五','六','七','八','九','十'];if(n<=10)return c[n];if(n<20)return'十'+(n%10?c[n%10]:'');if(n%10===0)return c[Math.floor(n/10)]+'十';return c[Math.floor(n/10)]+'十'+c[n%10];}

/* 版本简称（按钮上显示） */
const VER_SHORT={v120:'袁百二',v100:'容百回',v70:'金七十',jin70:'金批繁',jin70_pi:'金批全',jinshengtan:'金批简',jiqin:'冀勤注',zsk:'征四寇'};
const VER_NAME ={v120:'袁无涯百二十回全传',v100:'容与堂百回本',v70:'贯华堂七十回本',jin70:'金圣叹评本（繁）',jin70_pi:'金圣叹批评本（全批繁）',jinshengtan:'金圣叹批评本（简）',jiqin:'冀勤校注百回本',zsk:'征四寇（简本）'};

/* 批注元 */
const CMT={
  jinpi:{tag:'金批',who:'金圣叹',cls:'cmt-jinpi',color:'#8b1a1a',file:'jinpi_comments.json',okVer:['v70','jin70','jin70_pi','jinshengtan'],extract:d=>d.jin70_pi||d.jinpi||d},
  lizhuo:{tag:'容本',who:'李卓吾',cls:'cmt-lizhuo',color:'#8b4513',file:'lizhuo_comments.json',okVer:['v100','jiqin'],extract:d=>d},
  yuanwy:{tag:'袁本',who:'袁无涯',cls:'cmt-yuanwy',color:'#2e5a88',file:'yuanwy_comments.json',okVer:['v120'],extract:d=>d},
  jiqin:{tag:'冀注',who:'冀勤校注',cls:'cmt-jiqin',color:'#2f5d50',file:'jiqin_notes.json',okVer:['v100','jiqin'],extract:d=>d}
};

async function loadJSON(p){const r=await fetch(p);if(!r.ok)throw new Error('fail '+p);return r.json();}
async function loadText(p){const r=await fetch(p);if(!r.ok)return null;return r.text();}

async function boot(){
  const idx = await loadJSON('texts/versions/versions_index.json');
  state.versions = idx.versions;

  // 版本按钮
  const vg = document.getElementById('verGroup');
  idx.versions.forEach(v=>{
    const b=document.createElement('button');
    b.className='ui-btn ver-btn'+(v.id===state.vid?' active':'');
    b.textContent=VER_SHORT[v.id]||v.name.slice(0,4);
    b.title=VER_NAME[v.id]||v.name;
    b.onclick=()=>{state.vid=v.id;state.ch=1;syncURL();markVer();loadVer();};
    vg.appendChild(b);
  });

  // 语体按钮
  document.querySelectorAll('.lang-btn').forEach(b=>{
    if(b.dataset.lang===state.lang)b.classList.add('active');
    b.onclick=()=>{
      document.querySelectorAll('.lang-btn').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      state.lang=b.dataset.lang;localStorage.setItem('sh_lang',state.lang);loadChap();
    };
  });

  // 批注按钮
  document.querySelectorAll('.cmt-btn').forEach(b=>{
    if(b.dataset.cmt===state.cmt)b.classList.add('active');
    b.onclick=()=>{
      state.cmt=b.dataset.cmt;localStorage.setItem('sh_cmt',state.cmt);
      document.querySelectorAll('.cmt-btn').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      applyCmt();
    };
  });

  // 勾选
  const cc=document.getElementById('chkCmtOnly'), cb=document.getElementById('chkBai');
  cc.checked=state.onlyCmt; cb.checked=state.withBai;
  document.body.classList.toggle('cmt-only',state.onlyCmt);
  cc.onchange=()=>{state.onlyCmt=cc.checked;localStorage.setItem('sh_only',state.onlyCmt?'1':'0');document.body.classList.toggle('cmt-only',state.onlyCmt);};
  cb.onchange=()=>{state.withBai=cb.checked;localStorage.setItem('sh_bai',state.withBai?'1':'0');loadChap();};

  await loadVer(true);
}
function markVer(){document.querySelectorAll('.ver-btn').forEach(b=>b.classList.toggle('active',b.textContent===VER_SHORT[state.vid]));}

async function loadVer(first){
  if(!state.chapters[state.vid]){
    try{state.chapters[state.vid]=await loadJSON('texts/versions/'+state.vid+'/chapters.json');}
    catch(e){document.getElementById('contentWrap').innerHTML='<div class="loading">该版本尚未整理完成</div>';return;}
  }
  const cnt=state.chapters[state.vid].count;
  if(state.ch>=cnt)state.ch=cnt-1;if(state.ch<0)state.ch=0;

  const sel=document.getElementById('selChap');sel.innerHTML='';
  state.chapters[state.vid].chapters.forEach((c,i)=>{
    const o=document.createElement('option');o.value=i;o.textContent=`${i+1}. ${c.title||'第'+(i+1)+'回'}`;sel.appendChild(o);
  });
  sel.value=state.ch;
  sel.onchange=()=>{state.ch=parseInt(sel.value,10);syncURL();loadChap();};
  if(!first)syncURL();
  await loadChap();
}
function syncURL(){const u=new URL(location.href);u.searchParams.set('vid',state.vid);u.searchParams.set('ch',state.ch);history.replaceState({},'',u.toString());}

function renderTxt(txt){
  const bs=txt.split(/\n\s*\n/);let h='';
  bs.forEach(b=>{
    b=b.trim();if(!b)return;
    const ls=b.split(/\n/).map(l=>l.trim()).filter(Boolean);
    const poem=ls.length>=2&&ls.every(l=>l.length<30)&&(/诗|曰|词|古风|偈|吟|赋|歌/.test(ls[0])||ls.every(l=>/[，。？！,?.!]$/.test(l)));
    if(poem){h+='<div class="poem">';ls.forEach(l=>h+='<p>'+esc(l)+'</p>');h+='</div>';}
    else if(/^第[一二三四五六七八九十百零]+回|^楔子|^引首/.test(ls[0])&&ls[0].length<40){h+='<h3>'+esc(ls.join(' '))+'</h3>';}
    else ls.forEach(l=>h+='<p>'+esc(l)+'</p>');
  });
  return h;
}

async function loadChap(){
  const chap=state.chapters[state.vid].chapters[state.ch];
  document.getElementById('chapTitle').textContent=chap.title;
  document.getElementById('chapVer').textContent=state.chapters[state.vid].version_name;
  const wrap=document.getElementById('contentWrap');
  wrap.innerHTML='<div class="loading">正在载入正文…</div>';
  const fn=chap.file;
  if(!fn){wrap.innerHTML='<div class="loading">无此回正文</div>';updPgr();return;}
  const fp='texts/versions/'+state.vid+'/'+state.lang+'/'+fn;
  const txt=await loadText(fp);
  if(!txt){wrap.innerHTML='<div class="loading">该版本此语体暂未整理<br><small>'+esc(fp)+'</small></div>';updPgr();return;}

  let baiH='';
  if(state.withBai&&state.lang!=='bai'){
    const bf='texts/versions/'+state.vid+'/bai/'+fn;
    let bt=state.baiCache[bf];
    if(bt===undefined){bt=await loadText(bf);state.baiCache[bf]=bt;}
    if(bt)baiH='<div class="baihua-block"><span class="baihua-label">白话译文</span>'+esc(bt).replace(/\n\s*\n/g,'<br><br>').replace(/\n/g,'')+'</div>';
  }

  wrap.innerHTML=renderTxt(txt)+baiH;
  updPgr();applyCmt();
}

function updPgr(){
  const cnt=state.chapters[state.vid].count,pr=state.ch-1,nx=state.ch+1;
  let h='';
  h+=pr>=0?`<a href="#" onclick="go(${pr});return false;">← 上一回</a>`:`<a class="disabled">← 上一回</a>`;
  h+=nx<cnt?`<a href="#" onclick="go(${nx});return false;">下一回 →</a>`:`<a class="disabled">下一回 →</a>`;
  document.getElementById('pager').innerHTML=h;
}
function go(n){state.ch=n;syncURL();document.getElementById('selChap').value=n;loadChap();window.scrollTo(0,0);}

/* ========== 批注 ========== */
async function applyCmt(){
  document.querySelectorAll('.cmt-block,.notice').forEach(e=>e.remove());
  if(state.cmt==='none')return;
  const m=CMT[state.cmt];if(!m)return;

  if(!state.comments[state.cmt]){
    try{state.comments[state.cmt]=await loadJSON('texts/versions/'+m.file);}catch(e){state.comments[state.cmt]=null;}
  }
  const data=state.comments[state.cmt];
  if(!data){notice('加载'+m.who+'批失败。');return;}
  if(!m.okVer.includes(state.vid)){notice('此批注（<b>'+m.tag+'</b>）仅适用于 '+m.okVer.map(v=>VER_NAME[v]||v).join(' / ')+'，请切换到相应版本查看。');return;}

  const wrap=document.getElementById('contentWrap');
  const firstP=wrap.querySelector('p');
  const blocks=[];

  if(state.cmt==='lizhuo'||state.cmt==='yuanwy') collectChapters(data,m,blocks);
  else collectDict(data,m,blocks);

  if(blocks.length===0){notice('本回暂无'+m.who+'批注。');return;}

  blocks.forEach(b=>{
    const d=document.createElement('div');
    d.className='cmt-block '+m.cls+(b.preface?' cmt-preface':'');
    d.innerHTML='<span class="cmt-tag">'+b.tag+'</span><span class="cmt-text">'+b.html+'</span>';
    if(b.where==='top'&&firstP)firstP.parentElement.insertBefore(d,firstP);
    else wrap.appendChild(d);
  });
}
function notice(h){const d=document.createElement('div');d.className='notice';d.innerHTML=h;document.getElementById('contentWrap').appendChild(d);}

function collectDict(data,m,blocks){
  const sub=m.extract(data);
  let ch=sub[String(state.ch)];
  if(!ch)for(const k of [String(state.ch-1),String(state.ch+1)]){if(sub[k]&&sub[k].preface){ch=sub[k];break;}}
  if(!ch)return;
  if(ch.preface){
    blocks.push({where:'top',tag:m.tag+'·回前批',preface:true,html:esc(ch.preface).replace(/\n/g,'<br>')});
  }
  const keys=Object.keys(ch).filter(k=>k!=='preface'&&k!=='inline_count'&&ch[k]);
  if(keys.length){
    const items=[];
    keys.forEach((k,i)=>{
      const v=ch[k];
      if(typeof v==='string')items.push('<div class="cmt-sub"><b style="color:'+m.color+';">〔'+(i+1)+'〕</b>'+esc(v)+'</div>');
      else if(v&&typeof v==='object')Object.entries(v).forEach(([kk,vv])=>{items.push('<div class="cmt-sub"><b style="color:'+m.color+';">〔'+(i+1)+'·'+esc(kk)+'〕</b>'+esc(String(vv))+'</div>');});
    });
    const label = state.cmt==='jiqin'?m.tag+'·名物注释':m.tag+'·夹批';
    blocks.push({where:'bottom',tag:label,html:items.join('')});
  }
}

function collectChapters(data,m,blocks){
  const cur=state.chapters[state.vid].chapters[state.ch];
  const tgt=state.ch===0?null:'第'+cnNum(state.ch)+'回';
  let firstMatch=null;
  if(state.ch===0&&/引首|楔子|张天师/.test(cur.title||''))firstMatch=data.chapters.find(c=>c.chapter==='引首+第一回');
  if(!firstMatch)firstMatch=data.chapters.find(c=>c.chapter&&c.chapter===tgt)||data.chapters.find(c=>c.chapter==='全书');

  // 序文（前2回显示）
  if(state.ch<=1){
    data.chapters.forEach(c=>{(c.preface_comments||[]).forEach(p=>{
      blocks.push({where:'top',tag:m.tag+'·序',preface:true,html:'<div style="font-size:13px;color:#8a7a62;margin-bottom:6px;">—— '+esc(p.author||m.who)+'《'+esc(p.source||'评点')+'》</div>'+esc(p.text).replace(/\n/g,'<br>')});
    });});
  }
  if(firstMatch){
    const cms=firstMatch.chapter_comments||[];
    if(cms.length){
      blocks.push({where:'bottom',tag:m.tag+'·回评',html:cms.map(c=>{
        const lab=c.type==='回末总评'?'回末总评':(c.type==='眉批'?'眉批':(c.type==='旁批'?'旁批':(c.type==='夹批'?'夹批':c.type||'评')));
        return '<div class="cmt-sub"><b style="color:'+m.color+';">〔'+lab+(c.anchor?'·'+esc(c.anchor):'')+'〕</b>'+esc(c.text)+'</div>';
      }).join('')});
    }
  }
  if(state.ch<=1&&data.art_theory&&data.art_theory.length){
    blocks.push({where:'bottom',tag:m.tag+'·读法',html:data.art_theory.map(a=>'<div class="cmt-sub"><b style="color:'+m.color+';">「'+esc(a.keyword)+'」</b>（'+esc(a.source)+'）：'+esc(a.point)+'</div>').join('')});
  }
}

boot().catch(e=>{document.getElementById('contentWrap').innerHTML='<div class="loading">加载失败：'+esc(e.message)+'</div>';console.error(e);});
</script>
