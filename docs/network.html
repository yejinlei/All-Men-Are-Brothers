<script>
function esc(s){return String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
let T=null,C=null,gc=null,cc=null,pos=null,timer=null;
const typeOff={};
Promise.all([fetch('data/relation_timeline.json').then(r=>r.json()),fetch('data/centrality.json').then(r=>r.json())])
  .then(([a,b])=>{T=a;C=b;init();}).catch(e=>{document.querySelector('.page-sub').textContent='数据加载失败：'+e;});

function layout(nodes,links,W,H){
  const p={}; const cx=W/2,cy=H/2;
  nodes.forEach((n,i)=>{const a=2*Math.PI*i/nodes.length;p[n.id]={x:cx+W*0.36*Math.cos(a),y:cy+H*0.38*Math.sin(a)};});
  const k=Math.sqrt(W*H/nodes.length);
  for(let it=0;it<260;it++){
    const d={}; nodes.forEach(n=>d[n.id]={x:0,y:0});
    for(let i=0;i<nodes.length;i++)for(let j=i+1;j<nodes.length;j++){
      const a=nodes[i].id,b=nodes[j].id;
      let dx=p[a].x-p[b].x,dy=p[a].y-p[b].y,dd=Math.hypot(dx,dy)||.01;
      const f=k*k/dd,ux=dx/dd,uy=dy/dd;
      d[a].x+=ux*f;d[a].y+=uy*f;d[b].x-=ux*f;d[b].y-=uy*f;
    }
    links.forEach(e=>{const a=e.source,b=e.target;if(!p[a]||!p[b])return;
      let dx=p[a].x-p[b].x,dy=p[a].y-p[b].y,dd=Math.hypot(dx,dy)||.01,f=dd*dd/k,ux=dx/dd,uy=dy/dd;
      d[a].x-=ux*f;d[a].y-=uy*f;d[b].x+=ux*f;d[b].y+=uy*f;});
    const t=W*0.09*(1-it/260);
    nodes.forEach(n=>{const q=d[n.id],dl=Math.hypot(q.x,q.y)||.01;
      p[n.id].x=Math.min(W-18,Math.max(18,p[n.id].x+q.x/dl*t));
      p[n.id].y=Math.min(H-18,Math.max(18,p[n.id].y+q.y/dl*t));});
  }
  return p;
}

function draw(hui){
  document.getElementById('huiNow').textContent=hui;
  const onEdges=T.edges.filter(e=>e.first_hui!=null&&e.first_hui<=hui&&!typeOff[e.type]);
  const shown=new Set();onEdges.forEach(e=>{shown.add(e.source);shown.add(e.target);});
  const nodes=T.nodes.map(n=>{
    const vis=shown.has(n.name);
    return {id:n.name,name:n.name,x:pos[n.name].x,y:pos[n.name].y,symbolSize:vis?11:4,
      itemStyle:{color:T.types.find(t=>t.name===(T.edges.find(e=>e.source===n.name||e.target===n.name)||{}).type)?.color||'#8a7d6a',
        opacity:vis?1:0.12},label:{show:vis,fontSize:10}};
  });
  gc.setOption({series:[{type:'graph',layout:'none',data:nodes,roam:true,
    links:onEdges.map(e=>({source:e.source,target:e.target,lineStyle:{width:1.1,opacity:.35}})),
    emphasis:{focus:'adjacency'}}]},false);
  document.getElementById('stat').textContent='已现 '+shown.size+' 人 / 关系 '+onEdges.length+' 条';
}
function init(){
  document.getElementById('cnote').textContent=C.method;
  document.getElementById('exp').innerHTML='<tr><th>移除</th><th>连通分量</th><th>最大分量</th><th>平均路径</th><th>聚类系数</th></tr>'+
    C.experiments.map(r=>'<tr><td>'+esc(r.name)+'</td><td>'+r.components+'</td><td>'+r.giant_size+'（'+r.giant_ratio+'）</td><td>'+r.avg_path+'</td><td>'+r.clustering+'</td></tr>').join('');
  document.getElementById('chips').innerHTML=T.types.map(t=>
    '<span class="chip" data-t="'+esc(t.name)+'"><span class="dot" style="background:'+t.color+'"></span>'+esc(t.name)+' '+t.count+'</span>').join('');

  gc=echarts.init(document.getElementById('graph'));
  cc=echarts.init(document.getElementById('cent'));
  const W=document.getElementById('graph').clientWidth||1100,H=520;
  pos=layout(T.nodes,T.edges,W,H);

  cc.setOption({tooltip:{},grid:{left:70,right:24,top:20,bottom:30},
    xAxis:{type:'value',name:'度'},yAxis:{type:'category',data:C.top_degree.map(r=>r.name).reverse(),axisLabel:{fontSize:12}},
    series:[{type:'bar',data:C.top_degree.map(r=>r.value).reverse(),itemStyle:{color:'#c0392b'},label:{show:true,position:'right'}}]});

  draw(0);
  document.getElementById('hui').oninput=e=>draw(+e.target.value);
  document.getElementById('reset').onclick=()=>{document.getElementById('hui').value=0;draw(0);};
  document.getElementById('play').onclick=function(){
    if(timer){clearInterval(timer);timer=null;this.textContent='▶ 播放';return;}
    this.textContent='⏸ 暂停';
    let h=+document.getElementById('hui').value;
    timer=setInterval(()=>{h++;if(h>120){clearInterval(timer);timer=null;document.getElementById('play').textContent='▶ 播放';return;}
      document.getElementById('hui').value=h;draw(h);},420);
  };
  document.querySelectorAll('#chips .chip').forEach(ch=>ch.onclick=()=>{
    const t=ch.dataset.t;typeOff[t]=!typeOff[t];ch.classList.toggle('off',!!typeOff[t]);draw(+document.getElementById('hui').value);});
  gc.on('click',p=>{if(p.dataType!=='node')return;const n=T.nodes.find(x=>x.name===p.name)||{};
    document.getElementById('det').innerHTML='<b>'+esc(p.name)+'</b>'+(n.nickname?'　'+esc(n.nickname):'')+
      '<br>天罡地煞：'+esc(n.star||'—')+'　排名：'+(n.rank||'—')+'　派系：'+esc(n.faction||'—')+
      '<br>出场回：'+(n.first_hui||'—');});
  document.querySelectorAll('.tabs .tab').forEach(b=>b.onclick=()=>{
    document.querySelectorAll('.tabs .tab').forEach(x=>x.classList.remove('on'));b.classList.add('on');
    const v=b.dataset.v;
    document.getElementById('tab-evo').style.display=v==='evo'?'block':'none';
    document.getElementById('tab-cent').style.display=v==='cent'?'block':'none';
    setTimeout(()=>{gc.resize();cc.resize();},60);
  });
  window.addEventListener('resize',()=>{gc.resize();cc.resize();});
}
</script>
