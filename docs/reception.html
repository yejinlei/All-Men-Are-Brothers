<div class="wrap">
  <div class="page-title">评点接受史</div>
  <div class="page-sub" id="sub">九家批注，自明万历至当代，跨越四百年。横轴回目 0–120，纵轴按评点家年代排序，
  色深表示该回受到的批语密度——一眼看出「哪一回最受评点家关注」。</div>

  <div class="panel">
    <div class="tabs">
      <div class="tab on" data-m="count">按批语条数</div>
      <div class="tab" data-m="chars">按批语字数</div>
      <div class="tab" data-m="norm">按行归一化</div>
    </div>
    <div id="heat"></div>
    <div class="hint" id="hint"></div>
  </div>

  <div class="panel">
    <h3>九家批注</h3>
    <div id="list"></div>
    <div class="hint" id="total"></div>
  </div>
</div>

<script>
function esc(s){return String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
let D=null,metric='count',chart=null;
fetch('data/critics_heatmap.json').then(r=>r.json()).then(d=>{D=d;init();}).catch(e=>{document.getElementById('sub').textContent='数据加载失败：'+e;});

function matrix(m){
  const rows=D.critics.map(c=>D[m==='chars'?'matrix_chars':'matrix_count'][c.id]);
  if(m!=='norm')return rows;
  return rows.map(r=>{const mx=Math.max.apply(null,r)||1;return r.map(v=>+(v/mx).toFixed(3));});
}
function render(){
  const L=[],data=[];
  for(let h=0;h<=D.max_hui;h++)L.push(h);
  const rows=matrix(metric);
  let mx=0;
  D.critics.forEach((c,y)=>{rows[y].forEach((v,x)=>{data.push([x,y,v]);if(v>mx)mx=v;});});
  const names=D.critics.map(c=>c.tag+'·'+c.era);
  chart.setOption({
    tooltip:{formatter:p=>'第'+L[p.value[0]]+'回<br>'+names[p.value[1]]+'<br>值 '+p.value[2]},
    grid:{left:96,right:60,top:20,bottom:44},
    xAxis:{type:'category',data:L,axisLabel:{interval:9,fontSize:11},name:'回目',nameLocation:'middle',nameGap:26,nameTextStyle:{fontSize:12}},
    yAxis:{type:'category',data:names,axisLabel:{fontSize:11.5}},
    visualMap:{min:0,max:mx,calculable:true,orient:'vertical',right:8,top:'middle',inRange:{color:['#fff8ec','#f6c65b','#c0392b']}},
    series:[{type:'heatmap',data:data,progressive:2000,emphasis:{itemStyle:{borderColor:'#8b1a1a',borderWidth:1}},
      label:{show:false}}]
  },true);
  document.getElementById('hint').textContent={
    count:'按批语条数：九家合计 '+D.grand_total+' 条，与批注检索页载入数一致。',
    chars:'按批语字数：可看出王望如、金圣叹、冀勤等长篇批注家的分布。',
    norm:'按行归一化：抹平各家总产量差异，只看「关注分布的形状」。'}[metric];
}
function init(){
  chart=echarts.init(document.getElementById('heat'));
  render();
  document.getElementById('list').innerHTML=D.critics.map(c=>
    '<div class="crit"><span class="dot" style="background:'+c.color+'"></span>'+
    '<span class="who">'+esc(c.who)+'</span><span class="era">'+esc(c.era)+'（'+c.year+'）</span>'+
    '<span class="n">'+c.total+' 条</span><span class="n">'+c.chars+' 字</span>'+
    '<a href="search.html">在检索页查看 →</a></div>').join('');
  document.getElementById('total').textContent='注：冀勤校注为当代注本，条目数最众；余象斗、程穆衡现存卷目尚不全（见文档）。';
  document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));b.classList.add('on');
    metric=b.dataset.m;render();
  });
  window.addEventListener('resize',()=>chart.resize());
}
</script>
