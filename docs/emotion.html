<div class="wrap">
  <div class="page-title">情节情感曲线</div>
  <div class="page-sub" id="sub">以自建情感词典对繁／简原文逐回打分（不用白话层），得到全书的「情感心电图」与「激烈度曲线」。
  仅供参考的可计算指标，非定论。</div>

  <div class="panel">
    <div class="tabs" id="mtabs">
      <div class="tab on" data-m="pol">情感极性</div>
      <div class="tab" data-m="aro">激烈度</div>
    </div>
    <div class="tabs" id="vtabs"></div>
    <div id="curve"></div>
    <div class="hint" id="hint"></div>
  </div>

  <div class="panel">
    <h3>情节高潮与曲线值</h3>
    <table class="mini" id="events"></table>
    <div class="hint" id="lex"></div>
  </div>
</div>

<script>
function esc(s){return String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
let D=null,metric='pol',chart=null;
const SHOW=['v120','v100','v70'];
const on={v120:true,v100:false,v70:true};
fetch('data/emotion_curve.json').then(r=>r.json()).then(d=>{D=d;init();}).catch(e=>{document.getElementById('sub').textContent='数据加载失败：'+e;});

function series(vid){
  const v=D.versions[vid];
  const key=(metric==='pol')?'smoothed':'smoothed_aro';
  return {name:v.short+'（'+v.name.slice(0,10)+'）',type:'line',smooth:true,symbol:'none',
    lineStyle:{width:1.8,color:v.color},itemStyle:{color:v.color},
    data:v[key]};
}
function render(){
  const peaks = metric==='pol' ? D.peaks.map(p=>p.num) : [];
  chart.setOption({
    tooltip:{trigger:'axis'},
    legend:{top:0,textStyle:{fontSize:12}},
    grid:{left:54,right:24,top:44,bottom:40},
    xAxis:{type:'value',min:1,max:120,name:'回目',nameLocation:'middle',nameGap:26},
    yAxis:{type:'value',name:metric==='pol'?'情感极性':'激烈度',scale:true},
    series:SHOW.filter(v=>on[v]).map(vid=>{
      const s=series(vid);
      if(vid==='v120'&&peaks.length){s.markLine={silent:true,symbol:'none',
        lineStyle:{color:'#b8860b',opacity:.35,type:'dashed'},data:peaks.map(n=>({xAxis:n}))};}
      return s;
    })
  },true);
  const v=D.versions.v120;
  document.getElementById('hint').textContent = metric==='pol'
    ? '情感极性 =（正向词−负向词）/(正向词+负向词+1)，经 3 回滑动平滑；虚线为自动检出的峰值回目。'
    : '激烈度 = 打斗/杀戮类词语密度（每千字），反映情节的紧张程度。';
}
function init(){
  chart=echarts.init(document.getElementById('curve'));
  document.getElementById('vtabs').innerHTML=SHOW.map(vid=>{
    const v=D.versions[vid];
    return '<div class="tab'+(on[vid]?' on':'')+'" data-v="'+vid+'" style="'+(on[vid]?'':'')+'">'+esc(v.short)+'</div>';
  }).join('');
  render();
  document.querySelectorAll('#mtabs .tab').forEach(b=>b.onclick=()=>{
    document.querySelectorAll('#mtabs .tab').forEach(x=>x.classList.remove('on'));b.classList.add('on');
    metric=b.dataset.m;render();
  });
  document.querySelectorAll('#vtabs .tab').forEach(b=>b.onclick=()=>{
    const vid=b.dataset.v;on[vid]=!on[vid];b.classList.toggle('on',on[vid]);render();
  });
  const vids=SHOW;
  document.getElementById('events').innerHTML='<tr><th>回目</th><th>情节</th>'+vids.map(v=>'<th>'+esc(D.versions[v].short)+'</th>').join('')+'</tr>'+
    D.events.map(ev=>'<tr><td>第'+ev.hui+'回</td><td>'+esc(ev.label)+'</td>'+
      vids.map(v=>'<td>'+(ev.values[v]!=null?ev.values[v]:'—')+'</td>').join('')+'</tr>').join('');
  document.getElementById('lex').textContent='词典规模：正向 '+D.lexicon_sizes.pos+' 词、负向 '+D.lexicon_sizes.neg+' 词、激烈度 '+D.lexicon_sizes.arousal+' 词。'+D.note;
  window.addEventListener('resize',()=>chart.resize());
}
</script>
